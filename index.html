<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일렉기타 타브(TAB) & 가사 & 코드 & 오디오 연주 에디터</title>
  
  <!-- CDN Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.4/build/cjs/vexflow.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 20px;
    }
    .app-container { max-width: 1040px; margin: 0 auto; }
    
    /* 편집 패널 */
    .editor-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
      margin-bottom: 24px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-top h2 {
      font-size: 20px;
      font-weight: 800;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .meta-grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .meta-grid label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
    }
    .meta-grid input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .meta-grid input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
    }

    /* 프렛 번호 팔레트 */
    .palette-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .palette-title {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-right: 6px;
    }
    .fret-btn {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .fret-btn:hover { background: #e2e8f0; }
    .fret-btn.active {
      background: #2563eb;
      color: white;
      border-color: #1d4ed8;
      box-shadow: 0 2px 6px rgba(37,99,235,0.3);
    }
    .fret-btn.eraser.active {
      background: #dc2626;
      border-color: #b91c1c;
      color: white;
    }
    .custom-fret-input {
      width: 50px;
      height: 32px;
      text-align: center;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
    }

    /* 상단 액션 툴바 */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 15px;
      border-radius: 6px;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* 버튼 스타일 */
    .btn-play { background: #2563eb; color: white; }
    .btn-play:hover { background: #1d4ed8; }
    .btn-stop { background: #ef4444; color: white; }
    .btn-stop:hover { background: #dc2626; }

    .btn-save { background: #0284c7; color: white; }
    .btn-save:hover { background: #0369a1; }
    .btn-load { background: #0d9488; color: white; }
    .btn-load:hover { background: #0f766e; }
    .btn-reset { background: #f59e0b; color: white; }
    .btn-reset:hover { background: #d97706; }

    .btn-print { background: #059669; color: white; }
    .btn-print:hover { background: #047857; }
    .btn-add { background: #475569; color: white; }
    .btn-add:hover { background: #334155; }
    .btn-del { background: #fee2e2; color: #dc2626; }
    .btn-del:hover { background: #fecaca; }

    /* 알림 토스트 */
    .toast-msg {
      background: #10b981;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    /* 악보 목록 모달 팝업 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-card {
      background: white;
      width: 100%;
      max-width: 540px;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .modal-header h3 { font-size: 18px; color: #0f172a; }
    .saved-list {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 18px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .saved-item {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .saved-item:last-child { border-bottom: none; }
    .saved-item-info {
      flex: 1;
    }
    .saved-item-title { font-weight: 700; font-size: 14px; color: #1e293b; margin-bottom: 2px; }
    .saved-item-date { font-size: 11px; color: #64748b; }
    .saved-item-actions { display: flex; gap: 6px; }

    /* 마디 편집 상자 */
    .measure-box {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 22px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: border-color 0.2s;
    }
    .measure-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .measure-title {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
    }
    .measure-hint {
      font-size: 12px;
      color: #64748b;
    }

    /* 박자별 리듬(음가) 선택 컨트롤 바 */
    .rhythm-control-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
    }
    .beat-control {
      background: white;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .beat-control-title {
      font-size: 11px;
      font-weight: 800;
      color: #3b82f6;
      margin-bottom: 4px;
    }
    .rhythm-select {
      width: 100%;
      padding: 4px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      outline: none;
      background: #f8fafc;
      cursor: pointer;
    }

    /* 6선지 스태프 영역 */
    .staff-container {
      position: relative;
      background: #fafafa;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 0;
      overflow-x: auto;
    }
    .staff-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .staff-header-th {
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      padding: 5px 0;
      border-bottom: 2px solid #94a3b8;
      border-right: 1px dashed #cbd5e1;
      text-align: center;
    }
    .staff-header-corner {
      width: 100px;
      text-align: left;
      padding-left: 8px;
      border-right: 2px solid #64748b;
    }
    .beat-start-th {
      border-left: 2px solid #3b82f6;
      background: #e0f2fe;
      color: #0369a1;
    }

    /* 상단 코드(Chord) 입력 행 */
    .chord-title-td {
      background: #f0fdf4;
      color: #15803d;
      font-weight: 800;
      font-size: 12px;
      padding-left: 8px;
      border-right: 2px solid #16a34a;
      border-bottom: 2px solid #16a34a;
      height: 34px;
    }
    .chord-slot-td {
      background: #f0fdf4;
      border-bottom: 2px solid #16a34a;
      border-right: 1px dashed #bbf7d0;
      padding: 3px 2px;
      text-align: center;
    }
    .chord-slot-td.beat-start-td {
      border-left: 2px solid #86efac;
    }
    .chord-slot-td input {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 4px;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: #166534;
      padding: 3px 0;
      background: transparent;
      outline: none;
    }
    .chord-slot-td input:focus {
      background: #ffffff;
      border-color: #16a34a;
      box-shadow: 0 0 0 1.5px #16a34a;
    }

    /* 기타 6선지 행 */
    .str-label-td {
      background: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      font-family: monospace;
      padding-left: 8px;
      border-right: 2px solid #64748b;
      height: 38px;
    }
    .slot-cell {
      position: relative;
      height: 38px;
      cursor: pointer;
      border-right: 1px dashed #e2e8f0;
      text-align: center;
      padding: 0;
      vertical-align: middle;
      transition: background 0.1s;
    }
    .slot-cell.beat-start-td {
      border-left: 2px solid #e0f2fe;
    }
    .slot-cell.playing-slot {
      background: #fef08a !important;
    }
    .string-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: #94a3b8;
      z-index: 1;
      pointer-events: none;
    }
    .string-row-4 .string-line { height: 1.5px; background: #64748b; }
    .string-row-5 .string-line { height: 2px; background: #475569; }
    .string-row-6 .string-line { height: 2.5px; background: #334155; }

    /* 인라인 프렛 입력 인풋 */
    .inline-fret-input {
      position: relative;
      z-index: 3;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid transparent;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      background: transparent;
      color: #64748b;
      outline: none;
      transition: all 0.15s ease;
      margin: 0 auto;
      display: block;
      padding: 0;
      cursor: text;
    }
    .inline-fret-input:hover {
      background: rgba(37, 99, 235, 0.12);
      border-color: #93c5fd;
    }
    .inline-fret-input:focus {
      background: #ffffff;
      color: #1e293b;
      border: 2px solid #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    .inline-fret-input.has-fret {
      background: #1e293b;
      color: #ffffff;
      border: 1px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }
    .inline-fret-input.has-fret:focus {
      background: #2563eb;
      border-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35);
    }
    .inline-fret-input.has-mute {
      background: #dc2626 !important;
      color: #ffffff !important;
    }

    /* 가사 입력 행 */
    .lyric-title-td {
      background: #fefce8;
      color: #854d0e;
      font-weight: 700;
      font-size: 12px;
      padding-left: 8px;
      border-right: 2px solid #ca8a04;
      border-top: 2px solid #ca8a04;
      height: 32px;
    }
    .lyric-slot-td {
      background: #fefce8;
      border-top: 2px solid #ca8a04;
      border-right: 1px dashed #fef08a;
      padding: 3px 2px;
    }
    .lyric-slot-td.beat-start-td {
      border-left: 2px solid #fef08a;
    }
    .lyric-slot-td input {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 4px;
      text-align: center;
      font-size: 11px;
      padding: 3px 0;
      background: transparent;
      outline: none;
    }
    .lyric-slot-td input:focus {
      background: #ffffff;
      border-color: #ca8a04;
      box-shadow: 0 0 0 1px #ca8a04;
    }

    /* A4 악보 용지 영역 */
    .sheet-wrapper {
      display: flex;
      justify-content: center;
    }
    .a4-sheet {
      background: white;
      width: 794px;
      min-height: 1123px;
      padding: 35px 25px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }
    .sheet-header {
      text-align: center;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .sheet-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .sheet-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #334155;
    }
    .score-view svg {
      display: block;
      margin: 0 auto;
    }

    /* A4 세로 인쇄 최적화 (한 줄에 4마디) */
    @page {
      size: A4 portrait;
      margin: 10mm 12mm;
    }
    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
      }
      .no-print, .modal-overlay {
        display: none !important;
      }
      .sheet-wrapper {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .a4-sheet {
        width: 100% !important;
        min-height: auto !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .score-view svg {
        page-break-inside: avoid;
        width: 100% !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STRINGS = [
      { num: 1, label: "1 (High E)" },
      { num: 2, label: "2 (B)" },
      { num: 3, label: "3 (G)" },
      { num: 4, label: "4 (D)" },
      { num: 5, label: "5 (A)" },
      { num: 6, label: "6 (Low E)" }
    ];

    const BASE_FREQS = {
      1: 329.63, // E4
      2: 246.94, // B3
      3: 196.00, // G3
      4: 146.83, // D3
      5: 110.00, // A2
      6: 82.41   // E2
    };

    const PALETTE_FRETS = ["0", "1", "2", "3", "4", "5", "7", "8", "9", "10", "12", "15", "X", "DEL"];

    const createSlot = () => ({ chord: "", strings: {}, lyric: "" });

    function createBeat(type = "4") {
      let count = 1;
      if (type === "8") count = 2;
      else if (type === "16") count = 4;
      else if (type === "triplet") count = 3;
      else if (type === "2") count = 1;

      return {
        type,
        slots: Array.from({ length: count }, createSlot)
      };
    }

    const createInitialMeasures = () => {
      const m1 = {
        id: 1,
        beats: [
          createBeat("4"),
          createBeat("8"),
          createBeat("triplet"),
          createBeat("16")
        ]
      };
      m1.beats[0].slots[0].chord = "Am";
      m1.beats[0].slots[0].strings[1] = "0"; m1.beats[0].slots[0].strings[2] = "1"; m1.beats[0].slots[0].strings[3] = "2"; m1.beats[0].slots[0].lyric = "시-";
      m1.beats[1].slots[0].strings[3] = "2"; m1.beats[1].slots[0].lyric = "작-";
      m1.beats[1].slots[1].strings[3] = "0";
      m1.beats[2].slots[0].chord = "G";
      m1.beats[2].slots[0].strings[4] = "2"; m1.beats[2].slots[0].lyric = "하-";
      m1.beats[2].slots[1].strings[4] = "0";
      m1.beats[2].slots[2].strings[5] = "3"; m1.beats[2].slots[2].lyric = "는";
      m1.beats[3].slots[0].strings[5] = "0";
      m1.beats[3].slots[1].strings[5] = "2";
      m1.beats[3].slots[2].strings[5] = "3";
      m1.beats[3].slots[3].strings[6] = "3";

      const m2 = {
        id: 2,
        beats: [
          createBeat("8"),
          createBeat("8"),
          createBeat("2"),
          createBeat("4")
        ]
      };
      m2.beats[0].slots[0].chord = "C";
      m2.beats[0].slots[0].strings[1] = "3"; m2.beats[0].slots[0].lyric = "타-";
      m2.beats[0].slots[1].strings[2] = "0";
      m2.beats[1].slots[0].chord = "D7";
      m2.beats[1].slots[0].strings[3] = "0"; m2.beats[1].slots[0].lyric = "브-";
      m2.beats[1].slots[1].strings[4] = "0";
      m2.beats[2].slots[0].chord = "G";
      m2.beats[2].slots[0].strings[1] = "3"; m2.beats[2].slots[0].strings[6] = "3"; m2.beats[2].slots[0].lyric = "연습";

      const m3 = {
        id: 3,
        beats: [
          createBeat("4"),
          createBeat("4"),
          createBeat("8"),
          createBeat("8")
        ]
      };
      m3.beats[0].slots[0].chord = "F";
      m3.beats[0].slots[0].strings[1] = "1"; m3.beats[0].slots[0].strings[2] = "1"; m3.beats[0].slots[0].strings[3] = "2"; m3.beats[0].slots[0].lyric = "F";
      m3.beats[1].slots[0].chord = "G";
      m3.beats[1].slots[0].strings[3] = "2"; m3.beats[1].slots[0].lyric = "솔-";
      m3.beats[2].slots[0].chord = "C";
      m3.beats[2].slots[0].strings[2] = "1"; m3.beats[2].slots[0].lyric = "C";
      m3.beats[2].slots[1].strings[3] = "0";
      m3.beats[3].slots[0].strings[4] = "2"; m3.beats[3].slots[0].lyric = "로";
      m3.beats[3].slots[1].strings[5] = "3";

      const m4 = {
        id: 4,
        beats: [
          createBeat("2"),
          createBeat("4"),
          createBeat("2"),
          createBeat("4")
        ]
      };
      m4.beats[0].slots[0].chord = "E7";
      m4.beats[0].slots[0].strings[1] = "0"; m4.beats[0].slots[0].strings[2] = "0"; m4.beats[0].slots[0].strings[3] = "1"; m4.beats[0].slots[0].strings[4] = "0"; m4.beats[0].slots[0].strings[5] = "2"; m4.beats[0].slots[0].strings[6] = "0"; m4.beats[0].slots[0].lyric = "끝";
      m4.beats[2].slots[0].strings[1] = "0"; m4.beats[2].slots[0].strings[6] = "0";

      return [m1, m2, m3, m4];
    };

    const INITIAL_SONG = {
      title: "일렉기타 타브 & 가사 & 코드 악보",
      artist: "연주자",
      tuning: "Standard (E A D G B E)",
      tempo: "120",
      measures: createInitialMeasures()
    };

    function App() {
      const [song, setSong] = useState(INITIAL_SONG);
      const [selectedFret, setSelectedFret] = useState("0");
      const [customFret, setCustomFret] = useState("");
      const [isPlaying, setIsPlaying] = useState(false);
      const [playingSlotKey, setPlayingSlotKey] = useState(null);
      const [toast, setToast] = useState(null);
      const [showLoadModal, setShowLoadModal] = useState(false);
      const [savedList, setSavedList] = useState([]);

      const scoreRef = useRef(null);
      const audioCtxRef = useRef(null);
      const playTimersRef = useRef([]);
      const fileInputRef = useRef(null);

      // 토스트 메시지 출력
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // [기능 1]: 악보 저장하기 (브라우저 로컬 저장)
      const handleSave = () => {
        try {
          const key = "guitar_tab_saved_scores";
          const raw = localStorage.getItem(key);
          const list = raw ? JSON.parse(raw) : [];

          const newEntry = {
            id: Date.now(),
            savedAt: new Date().toLocaleString(),
            title: song.title || "무제 악보",
            data: song
          };

          // 기존 같은 제목이 있으면 덮어쓰거나 추가
          const updated = [newEntry, ...list.filter(item => item.title !== song.title)];
          localStorage.setItem(key, JSON.stringify(updated));
          showToast(`💾 "${song.title}" 악보가 안전하게 저장되었습니다! 언제든 [불러오기]에서 다시 열 수 있습니다.`);
        } catch (e) {
          showToast("저장 중 오류가 발생했습니다.");
        }
      };

      // [기능 2]: 악보 불러오기 모달 열기
      const handleOpenLoadModal = () => {
        try {
          const raw = localStorage.getItem("guitar_tab_saved_scores");
          const list = raw ? JSON.parse(raw) : [];
          setSavedList(list);
          setShowLoadModal(true);
        } catch (e) {
          setSavedList([]);
          setShowLoadModal(true);
        }
      };

      // 저장된 항목 로드
      const loadSavedScore = (entry) => {
        setSong(entry.data);
        setShowLoadModal(false);
        showToast(`📂 "${entry.title}" 악보를 성공적으로 불러왔습니다.`);
      };

      // 저장된 항목 삭제
      const deleteSavedScore = (id) => {
        const updated = savedList.filter(item => item.id !== id);
        setSavedList(updated);
        localStorage.setItem("guitar_tab_saved_scores", JSON.stringify(updated));
      };

      // [기능 3]: 전체 초기화 (새로 작성하기)
      const handleReset = () => {
        if (window.confirm("현재 작성 중인 악보를 모두 지우고 빈 악보로 새로 시작하시겠습니까?\n(중요한 악보는 미리 [저장하기]를 눌러 두세요)")) {
          setSong({
            title: "새로운 기타 악보",
            artist: "연주자",
            tuning: "Standard (E A D G B E)",
            tempo: "120",
            measures: [
              { id: Date.now(), beats: [createBeat("4"), createBeat("4"), createBeat("4"), createBeat("4")] },
              { id: Date.now() + 1, beats: [createBeat("4"), createBeat("4"), createBeat("4"), createBeat("4")] },
              { id: Date.now() + 2, beats: [createBeat("4"), createBeat("4"), createBeat("4"), createBeat("4")] },
              { id: Date.now() + 3, beats: [createBeat("4"), createBeat("4"), createBeat("4"), createBeat("4")] }
            ]
          });
          showToast("🔄 악보가 깨끗하게 초기화되었습니다. 새로 작성을 시작하세요!");
        }
      };

      // [보너스 기능]: PC 파일(.json)로 내보내기 & 가져오기
      const handleExportFile = () => {
        const blob = new Blob([JSON.stringify(song, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${song.title || "guitar_tab"}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("💾 컴퓨터 파일(.json)로 다운로드되었습니다.");
      };

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.measures) {
              setSong(data);
              setShowLoadModal(false);
              showToast(`📂 파일에서 "${data.title}" 악보를 성공적으로 불러왔습니다.`);
            } else {
              alert("올바른 악보 파일 형식이 아닙니다.");
            }
          } catch (err) {
            alert("파일을 읽는 중 오류가 발생했습니다.");
          }
        };
        reader.readAsText(file);
      };

      // 오디오 사운드 합성
      const playGuitarNote = (audioCtx, freq, durationSec) => {
        if (!freq || isNaN(freq)) return;
        const now = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, now);

        const oscSub = audioCtx.createOscillator();
        oscSub.type = "triangle";
        oscSub.frequency.setValueAtTime(freq, now);

        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(Math.min(freq * 8, 7500), now);
        filter.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.8, 350), now + 0.12);

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.0001, now);
        gainNode.gain.linearRampToValueAtTime(0.25, now + 0.006);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(durationSec * 1.3, 0.45));

        osc.connect(filter);
        oscSub.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start(now);
        oscSub.start(now);
        osc.stop(now + durationSec * 1.5);
        oscSub.stop(now + durationSec * 1.5);
      };

      const handlePlay = () => {
        if (isPlaying) {
          handleStop();
          return;
        }

        if (!audioCtxRef.current) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtxRef.current = new AudioContextClass();
        }
        if (audioCtxRef.current.state === "suspended") {
          audioCtxRef.current.resume();
        }

        setIsPlaying(true);
        playTimersRef.current = [];

        const bpm = parseInt(song.tempo, 10) || 120;
        const quarterSec = 60 / bpm;

        let currentOffset = 0;

        song.measures.forEach((m, mIdx) => {
          let skipNextBeat = false;
          for (let bIdx = 0; bIdx < m.beats.length; bIdx++) {
            if (skipNextBeat) {
              skipNextBeat = false;
              continue;
            }

            const beat = m.beats[bIdx];
            if (beat.type === "2") {
              if (bIdx === 0 || bIdx === 2) skipNextBeat = true;
            }

            let slotDurationSec = quarterSec;
            if (beat.type === "2") slotDurationSec = quarterSec * 2;
            else if (beat.type === "4") slotDurationSec = quarterSec;
            else if (beat.type === "8") slotDurationSec = quarterSec / 2;
            else if (beat.type === "16") slotDurationSec = quarterSec / 4;
            else if (beat.type === "triplet") slotDurationSec = quarterSec / 3;

            beat.slots.forEach((slot, sIdx) => {
              const scheduledTime = currentOffset;
              const slotKey = `${mIdx}-${bIdx}-${sIdx}`;

              const timer = setTimeout(() => {
                setPlayingSlotKey(slotKey);

                Object.keys(slot.strings).forEach((strNum, chordDelayIdx) => {
                  const fretVal = slot.strings[strNum];
                  if (fretVal !== undefined && fretVal !== "" && fretVal !== "X") {
                    const fNum = parseInt(fretVal, 10);
                    if (!isNaN(fNum)) {
                      const baseFreq = BASE_FREQS[strNum];
                      const noteFreq = baseFreq * Math.pow(2, fNum / 12);
                      setTimeout(() => {
                        playGuitarNote(audioCtxRef.current, noteFreq, slotDurationSec);
                      }, chordDelayIdx * 16);
                    }
                  }
                });
              }, scheduledTime * 1000);

              playTimersRef.current.push(timer);
              currentOffset += slotDurationSec;
            });
          }
        });

        const finishTimer = setTimeout(() => {
          setIsPlaying(false);
          setPlayingSlotKey(null);
        }, currentOffset * 1000 + 300);
        playTimersRef.current.push(finishTimer);
      };

      const handleStop = () => {
        playTimersRef.current.forEach(timer => clearTimeout(timer));
        playTimersRef.current = [];
        setIsPlaying(false);
        setPlayingSlotKey(null);
      };

      const addMeasure = () => {
        setSong(prev => ({
          ...prev,
          measures: [
            ...prev.measures,
            {
              id: Date.now(),
              beats: [createBeat("4"), createBeat("4"), createBeat("4"), createBeat("4")]
            }
          ]
        }));
      };

      const removeMeasure = () => {
        if (song.measures.length <= 1) return;
        setSong(prev => ({ ...prev, measures: prev.measures.slice(0, -1) }));
      };

      const handleSlotChordChange = (mIdx, bIdx, slotIdx, val) => {
        setSong(prev => {
          const nextMeasures = [...prev.measures];
          nextMeasures[mIdx].beats[bIdx].slots[slotIdx].chord = val;
          return { ...prev, measures: nextMeasures };
        });
      };

      const handleRhythmChange = (mIdx, bIdx, newType) => {
        setSong(prev => {
          const nextMeasures = [...prev.measures];
          nextMeasures[mIdx].beats[bIdx] = createBeat(newType);
          return { ...prev, measures: nextMeasures };
        });
      };

      const handleInlineFretChange = (mIdx, bIdx, slotIdx, strNum, val) => {
        const clean = val.trim().toUpperCase();
        setSong(prev => {
          const nextMeasures = [...prev.measures];
          const currentStrings = { ...nextMeasures[mIdx].beats[bIdx].slots[slotIdx].strings };

          if (clean === "" || clean === "-") {
            delete currentStrings[strNum];
          } else {
            currentStrings[strNum] = clean;
            if (!audioCtxRef.current) {
              const AudioContextClass = window.AudioContext || window.webkitAudioContext;
              audioCtxRef.current = new AudioContextClass();
            }
            if (audioCtxRef.current.state === "suspended") {
              audioCtxRef.current.resume();
            }
            const fNum = parseInt(clean, 10);
            if (!isNaN(fNum)) {
              const freq = BASE_FREQS[strNum] * Math.pow(2, fNum / 12);
              playGuitarNote(audioCtxRef.current, freq, 0.45);
            }
          }

          nextMeasures[mIdx].beats[bIdx].slots[slotIdx].strings = currentStrings;
          return { ...prev, measures: nextMeasures };
        });
      };

      const handleFretKeyDown = (e, mIdx, bIdx, sIdx, strNum) => {
        if (e.key === "ArrowUp") {
          e.preventDefault();
          if (strNum > 1) {
            document.getElementById(`fret-in-${mIdx}-${bIdx}-${sIdx}-${strNum - 1}`)?.focus();
          }
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          if (strNum < 6) {
            document.getElementById(`fret-in-${mIdx}-${bIdx}-${sIdx}-${strNum + 1}`)?.focus();
          }
        }
      };

      const handleLyricChange = (mIdx, bIdx, slotIdx, val) => {
        setSong(prev => {
          const nextMeasures = [...prev.measures];
          nextMeasures[mIdx].beats[bIdx].slots[slotIdx].lyric = val;
          return { ...prev, measures: nextMeasures };
        });
      };

      // VexFlow 렌더링
      useEffect(() => {
        if (!scoreRef.current) return;
        const container = scoreRef.current;
        container.innerHTML = "";

        const VF = Vex.Flow;
        const measuresPerRow = 4;
        const staveWidth = 175;
        const staveHeight = 160;
        const totalRows = Math.ceil(song.measures.length / measuresPerRow);

        const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
        renderer.resize(720, totalRows * staveHeight + 40);
        const context = renderer.getContext();

        song.measures.forEach((m, idx) => {
          const col = idx % measuresPerRow;
          const row = Math.floor(idx / measuresPerRow);
          const x = 10 + col * staveWidth;
          const y = 20 + row * staveHeight;

          const stave = new VF.TabStave(x, y, staveWidth);
          if (col === 0) {
            stave.addClef("tab");
          }
          stave.setContext(context).draw();

          const notes = [];
          const tuplets = [];
          let skipNextBeat = false;

          for (let bIdx = 0; bIdx < m.beats.length; bIdx++) {
            if (skipNextBeat) {
              skipNextBeat = false;
              continue;
            }

            const beat = m.beats[bIdx];

            if (beat.type === "2") {
              if (bIdx === 0 || bIdx === 2) skipNextBeat = true;
              const slot = beat.slots[0];
              const positions = [];
              for (let s = 1; s <= 6; s++) {
                if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                  positions.push({ str: s, fret: slot.strings[s] });
                }
              }
              const isNote = positions.length > 0;
              const tabNote = new VF.TabNote({
                positions: isNote ? positions : [{ str: 3, fret: "" }],
                duration: isNote ? "h" : "hr"
              });

              if (slot.chord && slot.chord.trim() !== "") {
                tabNote.addModifier(new VF.Annotation(slot.chord.trim()).setFont("sans-serif", 12, "bold").setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
              }
              if (slot.lyric && slot.lyric.trim() !== "") {
                tabNote.addModifier(new VF.Annotation(slot.lyric.trim()).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
              }
              notes.push(tabNote);
              continue;
            }

            if (beat.type === "4") {
              const slot = beat.slots[0];
              const positions = [];
              for (let s = 1; s <= 6; s++) {
                if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                  positions.push({ str: s, fret: slot.strings[s] });
                }
              }
              const isNote = positions.length > 0;
              const tabNote = new VF.TabNote({
                positions: isNote ? positions : [{ str: 3, fret: "" }],
                duration: isNote ? "q" : "qr"
              });

              if (slot.chord && slot.chord.trim() !== "") {
                tabNote.addModifier(new VF.Annotation(slot.chord.trim()).setFont("sans-serif", 12, "bold").setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
              }
              if (slot.lyric && slot.lyric.trim() !== "") {
                tabNote.addModifier(new VF.Annotation(slot.lyric.trim()).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
              }
              notes.push(tabNote);
            } else if (beat.type === "8") {
              beat.slots.forEach(slot => {
                const positions = [];
                for (let s = 1; s <= 6; s++) {
                  if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                    positions.push({ str: s, fret: slot.strings[s] });
                  }
                }
                const isNote = positions.length > 0;
                const tabNote = new VF.TabNote({
                  positions: isNote ? positions : [{ str: 3, fret: "" }],
                  duration: isNote ? "8" : "8r"
                });

                if (slot.chord && slot.chord.trim() !== "") {
                  tabNote.addModifier(new VF.Annotation(slot.chord.trim()).setFont("sans-serif", 12, "bold").setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
                }
                if (slot.lyric && slot.lyric.trim() !== "") {
                  tabNote.addModifier(new VF.Annotation(slot.lyric.trim()).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                }
                notes.push(tabNote);
              });
            } else if (beat.type === "16") {
              beat.slots.forEach(slot => {
                const positions = [];
                for (let s = 1; s <= 6; s++) {
                  if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                    positions.push({ str: s, fret: slot.strings[s] });
                  }
                }
                const isNote = positions.length > 0;
                const tabNote = new VF.TabNote({
                  positions: isNote ? positions : [{ str: 3, fret: "" }],
                  duration: isNote ? "16" : "16r"
                });

                if (slot.chord && slot.chord.trim() !== "") {
                  tabNote.addModifier(new VF.Annotation(slot.chord.trim()).setFont("sans-serif", 12, "bold").setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
                }
                if (slot.lyric && slot.lyric.trim() !== "") {
                  tabNote.addModifier(new VF.Annotation(slot.lyric.trim()).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                }
                notes.push(tabNote);
              });
            } else if (beat.type === "triplet") {
              const tripletNotes = [];
              beat.slots.forEach(slot => {
                const positions = [];
                for (let s = 1; s <= 6; s++) {
                  if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                    positions.push({ str: s, fret: slot.strings[s] });
                  }
                }
                const isNote = positions.length > 0;
                const tabNote = new VF.TabNote({
                  positions: isNote ? positions : [{ str: 3, fret: "" }],
                  duration: isNote ? "8" : "8r"
                });

                if (slot.chord && slot.chord.trim() !== "") {
                  tabNote.addModifier(new VF.Annotation(slot.chord.trim()).setFont("sans-serif", 12, "bold").setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
                }
                if (slot.lyric && slot.lyric.trim() !== "") {
                  tabNote.addModifier(new VF.Annotation(slot.lyric.trim()).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                }
                tripletNotes.push(tabNote);
                notes.push(tabNote);
              });

              try {
                const tuplet = new VF.Tuplet(tripletNotes, { num_notes: 3, notes_occupied: 2 });
                tuplet.setBracketed(true);
                tuplets.push(tuplet);
              } catch (e) {
                console.error(e);
              }
            }
          }

          VF.Formatter.FormatAndDraw(context, stave, notes);

          tuplets.forEach(t => {
            try {
              t.setContext(context).draw();
            } catch (e) {
              console.error(e);
            }
          });
        });
      }, [song]);

      return (
        <div className="app-container">
          {/* 알림 토스트 */}
          {toast && (
            <div className="toast-msg no-print">
              <span>{toast}</span>
              <button style={{ background: "transparent", color: "white", padding: 0 }} onClick={() => setToast(null)}>✕</button>
            </div>
          )}

          <div className="editor-card no-print">
            <div className="card-top">
              <h2>🎸 일렉기타 타브 & 가사 & 코드 & 오디오 연주 에디터</h2>
              <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                <button
                  className={isPlaying ? "btn-stop" : "btn-play"}
                  onClick={handlePlay}
                >
                  {isPlaying ? "⏹️ 연주 중지" : "▶️ 연주 듣기"}
                </button>
                <button className="btn-save" onClick={handleSave} title="브라우저에 현재 악보 저장">
                  💾 악보 저장
                </button>
                <button className="btn-load" onClick={handleOpenLoadModal} title="이전에 저장한 악보 불러오기">
                  📂 불러오기
                </button>
                <button className="btn-reset" onClick={handleReset} title="처음부터 다시 작성">
                  🔄 전체 초기화
                </button>
                <button className="btn-print" onClick={() => window.print()}>
                  🖨️ A4 악보 출력
                </button>
              </div>
            </div>

            <div className="meta-grid">
              <div>
                <label>곡 제목</label>
                <input value={song.title} onChange={e => setSong({...song, title: e.target.value})} />
              </div>
              <div>
                <label>아티스트</label>
                <input value={song.artist} onChange={e => setSong({...song, artist: e.target.value})} />
              </div>
              <div>
                <label>튜닝</label>
                <input value={song.tuning} onChange={e => setSong({...song, tuning: e.target.value})} />
              </div>
              <div>
                <label>템포 (BPM)</label>
                <input value={song.tempo} onChange={e => setSong({...song, tempo: e.target.value})} />
              </div>
            </div>

            {/* 빠른 프렛 팔레트 */}
            <div className="palette-box">
              <span className="palette-title">📌 빠른 프렛 버튼:</span>
              {PALETTE_FRETS.map(fret => (
                <button
                  key={fret}
                  className={`fret-btn ${fret === "DEL" ? "eraser" : ""} ${selectedFret === fret ? "active" : ""}`}
                  onClick={() => setSelectedFret(fret)}
                >
                  {fret === "DEL" ? "지우개" : fret}
                </button>
              ))}
              <input
                className="custom-fret-input"
                placeholder="직접"
                value={customFret}
                onChange={e => {
                  setCustomFret(e.target.value);
                  if (e.target.value.trim() !== "") setSelectedFret(e.target.value.trim());
                }}
              />
            </div>

            <div className="toolbar">
              <div className="btn-group">
                <button className="btn-add" onClick={addMeasure}>➕ 마디 추가</button>
                <button className="btn-del" onClick={removeMeasure}>➖ 마지막 마디 삭제</button>
              </div>
              <div className="btn-group">
                <button style={{ background: "#e2e8f0", color: "#334155" }} onClick={handleExportFile} title="내 컴퓨터 파일(.json)로 저장">
                  💾 파일로 백업 (.json)
                </button>
              </div>
            </div>

            {/* 마디 목록 */}
            {song.measures.map((m, mIdx) => (
              <div key={m.id} className="measure-box">
                <div className="measure-header">
                  <span className="measure-title">마디 #{mIdx + 1}</span>
                  <span className="measure-hint">💡 타브 선 위의 동그라미를 클릭하고 0~24 숫자를 바로 입력하세요.</span>
                </div>

                {/* 박자별 리듬(음가) 선택 컨트롤 바 */}
                <div className="rhythm-control-bar">
                  {m.beats.map((beat, bIdx) => (
                    <div key={bIdx} className="beat-control">
                      <div className="beat-control-title">{bIdx + 1}박자 음가</div>
                      <select
                        className="rhythm-select"
                        value={beat.type}
                        onChange={e => handleRhythmChange(mIdx, bIdx, e.target.value)}
                      >
                        <option value="4">🅠 4분음표 (1칸)</option>
                        <option value="8">🅠 8분음표 (2칸)</option>
                        <option value="16">🅠 16분음표 (4칸)</option>
                        <option value="triplet">🅠³ 셋잇단음표 (3칸)</option>
                        {(bIdx === 0 || bIdx === 2) && (
                          <option value="2">🅗 2분음표 (2박자 병합)</option>
                        )}
                      </select>
                    </div>
                  ))}
                </div>

                {/* 6선지 직접 찍기 & 바로 타이핑 에디터 */}
                <div className="staff-container">
                  <table className="staff-table">
                    <thead>
                      <tr>
                        <th className="staff-header-th staff-header-corner">구분 \ 박자</th>
                        {m.beats.map((beat, bIdx) =>
                          beat.slots.map((_, sIdx) => (
                            <th
                              key={`${bIdx}-${sIdx}`}
                              className={`staff-header-th ${sIdx === 0 ? "beat-start-th" : ""}`}
                            >
                              {sIdx === 0 ? `${bIdx + 1}박` : `+${sIdx}`}
                              <div style={{ fontSize: "10px", fontWeight: "normal", color: "#64748b" }}>
                                {beat.type === "4" ? "4분" : beat.type === "8" ? "8분" : beat.type === "16" ? "16분" : beat.type === "triplet" ? "3연" : "2분"}
                              </div>
                            </th>
                          ))
                        )}
                      </tr>
                    </thead>
                    <tbody>
                      {/* 코드 입력 행 */}
                      <tr>
                        <td className="chord-title-td">코드 (Chord)</td>
                        {m.beats.map((beat, bIdx) =>
                          beat.slots.map((slot, sIdx) => (
                            <td
                              key={`${bIdx}-${sIdx}`}
                              className={`chord-slot-td ${sIdx === 0 ? "beat-start-td" : ""}`}
                            >
                              <input
                                placeholder="코드"
                                value={slot.chord || ""}
                                onChange={e => handleSlotChordChange(mIdx, bIdx, sIdx, e.target.value)}
                              />
                            </td>
                          ))
                        )}
                      </tr>

                      {/* 6선지 현 (클릭 시 프렛 번호 바로 직접 작성) */}
                      {STRINGS.map(str => (
                        <tr key={str.num} className={`string-row string-row-${str.num}`}>
                          <td className="str-label-td">{str.label}</td>
                          {m.beats.map((beat, bIdx) =>
                            beat.slots.map((slot, sIdx) => {
                              const fretVal = slot.strings[str.num];
                              const slotKey = `${mIdx}-${bIdx}-${sIdx}`;
                              const isSlotPlaying = playingSlotKey === slotKey;
                              const inputId = `fret-in-${mIdx}-${bIdx}-${sIdx}-${str.num}`;
                              const hasFret = fretVal !== undefined && fretVal !== "";

                              return (
                                <td
                                  key={`${bIdx}-${sIdx}`}
                                  className={`slot-cell ${sIdx === 0 ? "beat-start-td" : ""} ${isSlotPlaying ? "playing-slot" : ""}`}
                                  onClick={() => document.getElementById(inputId)?.focus()}
                                >
                                  <div className="string-line"></div>
                                  <input
                                    id={inputId}
                                    className={`inline-fret-input ${hasFret ? "has-fret" : ""} ${fretVal === "X" ? "has-mute" : ""}`}
                                    value={fretVal || ""}
                                    placeholder="·"
                                    maxLength={2}
                                    onChange={e => handleInlineFretChange(mIdx, bIdx, sIdx, str.num, e.target.value)}
                                    onKeyDown={e => handleFretKeyDown(e, mIdx, bIdx, sIdx, str.num)}
                                    onFocus={e => e.target.select()}
                                    title={`${str.label} / ${bIdx + 1}박 ${sIdx + 1}번째 프렛 번호 입력`}
                                  />
                                </td>
                              );
                            })
                          )}
                        </tr>
                      ))}

                      {/* 가사 입력 행 */}
                      <tr>
                        <td className="lyric-title-td">가사 (Lyrics)</td>
                        {m.beats.map((beat, bIdx) =>
                          beat.slots.map((slot, sIdx) => (
                            <td
                              key={`${bIdx}-${sIdx}`}
                              className={`lyric-slot-td ${sIdx === 0 ? "beat-start-td" : ""}`}
                            >
                              <input
                                placeholder=""
                                value={slot.lyric || ""}
                                onChange={e => handleLyricChange(mIdx, bIdx, sIdx, e.target.value)}
                              />
                            </td>
                          ))
                        )}
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            ))}
          </div>

          {/* 저장 목록 불러오기 모달 */}
          {showLoadModal && (
            <div className="modal-overlay no-print" onClick={() => setShowLoadModal(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3>📂 저장된 악보 목록</h3>
                  <button style={{ background: "transparent", color: "#64748b", fontSize: "18px" }} onClick={() => setShowLoadModal(false)}>✕</button>
                </div>

                {savedList.length === 0 ? (
                  <p style={{ textAlign: "center", color: "#64748b", padding: "24px 0", fontSize: "14px" }}>
                    아직 브라우저에 저장된 악보가 없습니다.<br />[💾 악보 저장] 버튼을 눌러 악보를 저장해 보세요.
                  </p>
                ) : (
                  <div className="saved-list">
                    {savedList.map(item => (
                      <div key={item.id} className="saved-item">
                        <div className="saved-item-info">
                          <div className="saved-item-title">{item.title}</div>
                          <div className="saved-item-date">저장일시: {item.savedAt}</div>
                        </div>
                        <div className="saved-item-actions">
                          <button className="btn-load" style={{ padding: "6px 12px", fontSize: "12px" }} onClick={() => loadSavedScore(item)}>
                            열기
                          </button>
                          <button className="btn-del" style={{ padding: "6px 10px", fontSize: "12px" }} onClick={() => deleteSavedScore(item.id)}>
                            삭제
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid #e2e8f0", paddingTop: "14px" }}>
                  <button style={{ background: "#475569", color: "white", fontSize: "13px" }} onClick={() => fileInputRef.current?.click()}>
                    📁 컴퓨터에서 파일 열기 (.json)
                  </button>
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept=".json"
                    style={{ display: "none" }}
                    onChange={handleImportFile}
                  />
                  <button style={{ background: "#e2e8f0", color: "#334155", fontSize: "13px" }} onClick={() => setShowLoadModal(false)}>
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* A4 악보 용지 영역 */}
          <div className="sheet-wrapper">
            <div className="a4-sheet">
              <div className="sheet-header">
                <h1 className="sheet-title">{song.title}</h1>
                <div className="sheet-meta">
                  <span><strong>Artist:</strong> {song.artist}</span>
                  <span><strong>Tuning:</strong> {song.tuning}</span>
                  <span><strong>Tempo:</strong> ♩={song.tempo}</span>
                  <span><strong>Layout:</strong> 4 Measures / Line</span>
                </div>
              </div>
              <div ref={scoreRef} className="score-view" />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
