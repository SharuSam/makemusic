<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일렉기타 타브(TAB) & 가사 & 코드 에디터</title>
  
  <!-- CDN Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.4/build/cjs/vexflow.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 20px;
    }
    .app-container { max-width: 1040px; margin: 0 auto; }
    
    /* 편집 패널 */
    .editor-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
      margin-bottom: 24px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .card-top h2 {
      font-size: 20px;
      font-weight: 800;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .meta-grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .meta-grid label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
    }
    .meta-grid input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .meta-grid input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
    }

    /* 프렛 번호 팔레트 */
    .palette-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .palette-title {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-right: 6px;
    }
    .fret-btn {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .fret-btn:hover { background: #e2e8f0; }
    .fret-btn.active {
      background: #2563eb;
      color: white;
      border-color: #1d4ed8;
      box-shadow: 0 2px 6px rgba(37,99,235,0.3);
    }
    .fret-btn.eraser.active {
      background: #dc2626;
      border-color: #b91c1c;
      color: white;
    }
    .custom-fret-input {
      width: 50px;
      height: 32px;
      text-align: center;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    button {
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 6px;
      border: none;
      transition: all 0.2s;
    }
    .btn-print { background: #059669; color: white; font-size: 15px; }
    .btn-print:hover { background: #047857; }
    .btn-add { background: #2563eb; color: white; }
    .btn-add:hover { background: #1d4ed8; }
    .btn-del { background: #fee2e2; color: #dc2626; }
    .btn-del:hover { background: #fecaca; }

    /* 마디 편집 상자 */
    .measure-box {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 22px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .measure-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .measure-title {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
    }

    /* 상단 코드 입력 영역 */
    .chord-input-area {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .chord-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chord-group label {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
    }
    .chord-input {
      width: 70px;
      padding: 4px 8px;
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      text-align: center;
    }
    .chord-input:focus {
      border-color: #2563eb;
      outline: 2px solid #2563eb;
    }

    /* 박자별 리듬(음가) 선택 컨트롤 바 */
    .rhythm-control-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
    }
    .beat-control {
      background: white;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .beat-control-title {
      font-size: 11px;
      font-weight: 800;
      color: #3b82f6;
      margin-bottom: 4px;
    }
    .rhythm-select {
      width: 100%;
      padding: 4px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      outline: none;
      background: #f8fafc;
      cursor: pointer;
    }

    /* 6선지 스태프 영역 */
    .staff-container {
      position: relative;
      background: #fafafa;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 0 6px 0;
      overflow-x: auto;
    }
    .staff-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    /* 헤더 */
    .staff-header-th {
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      padding: 6px 0;
      border-bottom: 2px solid #94a3b8;
      border-right: 1px dashed #cbd5e1;
      text-align: center;
    }
    .staff-header-corner {
      width: 100px;
      text-align: left;
      padding-left: 8px;
      border-right: 2px solid #64748b;
    }
    .beat-start-th {
      border-left: 2px solid #3b82f6;
      background: #e0f2fe;
      color: #0369a1;
    }

    /* 기타 6선지 행 */
    .str-label-td {
      background: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      font-family: monospace;
      padding-left: 8px;
      border-right: 2px solid #64748b;
      height: 34px;
    }
    .slot-cell {
      position: relative;
      height: 34px;
      cursor: pointer;
      border-right: 1px dashed #e2e8f0;
      text-align: center;
      padding: 0;
    }
    .slot-cell.beat-start-td {
      border-left: 2px solid #e0f2fe;
    }
    .string-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: #94a3b8;
      z-index: 1;
      pointer-events: none;
    }
    .string-row-4 .string-line { height: 1.5px; background: #64748b; }
    .string-row-5 .string-line { height: 2px; background: #475569; }
    .string-row-6 .string-line { height: 2.5px; background: #334155; }

    /* 찍힌 프렛 뱃지 */
    .fret-badge {
      position: relative;
      z-index: 2;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #1e293b;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      border: 1px solid #ffffff;
    }
    .fret-badge.fret-mute {
      background: #dc2626;
    }
    .slot-cell:hover::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.35);
      z-index: 2;
    }

    /* 가사 입력 행 */
    .lyric-title-td {
      background: #fefce8;
      color: #854d0e;
      font-weight: 700;
      font-size: 12px;
      padding-left: 8px;
      border-right: 2px solid #ca8a04;
      border-top: 2px solid #ca8a04;
      height: 32px;
    }
    .lyric-slot-td {
      background: #fefce8;
      border-top: 2px solid #ca8a04;
      border-right: 1px dashed #fef08a;
      padding: 3px 2px;
    }
    .lyric-slot-td.beat-start-td {
      border-left: 2px solid #fef08a;
    }
    .lyric-slot-td input {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 4px;
      text-align: center;
      font-size: 11px;
      padding: 3px 0;
      background: transparent;
      outline: none;
    }
    .lyric-slot-td input:focus {
      background: #ffffff;
      border-color: #ca8a04;
      box-shadow: 0 0 0 1px #ca8a04;
    }

    /* A4 악보 용지 영역 */
    .sheet-wrapper {
      display: flex;
      justify-content: center;
    }
    .a4-sheet {
      background: white;
      width: 794px;
      min-height: 1123px;
      padding: 35px 25px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }
    .sheet-header {
      text-align: center;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .sheet-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .sheet-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #334155;
    }
    .score-view svg {
      display: block;
      margin: 0 auto;
    }

    /* A4 세로 인쇄 최적화 (한 줄에 4마디) */
    @page {
      size: A4 portrait;
      margin: 10mm 12mm;
    }
    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .sheet-wrapper {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .a4-sheet {
        width: 100% !important;
        min-height: auto !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .score-view svg {
        page-break-inside: avoid;
        width: 100% !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STRINGS = [
      { num: 1, label: "1 (High E)" },
      { num: 2, label: "2 (B)" },
      { num: 3, label: "3 (G)" },
      { num: 4, label: "4 (D)" },
      { num: 5, label: "5 (A)" },
      { num: 6, label: "6 (Low E)" }
    ];

    const PALETTE_FRETS = ["0", "1", "2", "3", "4", "5", "7", "8", "9", "10", "12", "15", "X", "DEL"];

    // 리듬 슬롯 생성
    const createSlot = () => ({ strings: {}, lyric: "" });

    function createBeat(type = "4") {
      let count = 1;
      if (type === "8") count = 2;
      else if (type === "16") count = 4;
      else if (type === "triplet") count = 3;
      else if (type === "2") count = 1; // 2분음표는 1슬롯 (2박자 지속)

      return {
        type, // "2", "4", "8", "16", "triplet"
        slots: Array.from({ length: count }, createSlot)
      };
    }

    // 초기 데모 곡
    const createInitialMeasures = () => {
      // 마디 1: Am 코드, 4분, 8분, 셋잇단, 16분
      const m1 = {
        id: 1,
        chord1: "Am",
        chord2: "",
        beats: [
          createBeat("4"),
          createBeat("8"),
          createBeat("triplet"),
          createBeat("16")
        ]
      };
      m1.beats[0].slots[0].strings[1] = "0"; m1.beats[0].slots[0].strings[2] = "1"; m1.beats[0].slots[0].strings[3] = "2"; m1.beats[0].slots[0].lyric = "시-";
      m1.beats[1].slots[0].strings[3] = "2"; m1.beats[1].slots[0].lyric = "작-";
      m1.beats[1].slots[1].strings[3] = "0";
      m1.beats[2].slots[0].strings[4] = "2"; m1.beats[2].slots[0].lyric = "하-";
      m1.beats[2].slots[1].strings[4] = "0";
      m1.beats[2].slots[2].strings[5] = "3"; m1.beats[2].slots[2].lyric = "는";
      m1.beats[3].slots[0].strings[5] = "0";
      m1.beats[3].slots[1].strings[5] = "2";
      m1.beats[3].slots[2].strings[5] = "3";
      m1.beats[3].slots[3].strings[6] = "3";

      // 마디 2: G 코드, 8분, 8분, 2분음표
      const m2 = {
        id: 2,
        chord1: "G",
        chord2: "",
        beats: [
          createBeat("8"),
          createBeat("8"),
          createBeat("2"),
          createBeat("4") // 2분음표에 흡수됨
        ]
      };
      m2.beats[0].slots[0].strings[1] = "3"; m2.beats[0].slots[0].lyric = "타-";
      m2.beats[0].slots[1].strings[2] = "0";
      m2.beats[1].slots[0].strings[3] = "0"; m2.beats[1].slots[0].lyric = "브-";
      m2.beats[1].slots[1].strings[4] = "0";
      m2.beats[2].slots[0].strings[1] = "3"; m2.beats[2].slots[0].strings[6] = "3"; m2.beats[2].slots[0].lyric = "연습";

      // 마디 3: F, C 코드
      const m3 = {
        id: 3,
        chord1: "F",
        chord2: "C",
        beats: [
          createBeat("4"),
          createBeat("4"),
          createBeat("8"),
          createBeat("8")
        ]
      };
      m3.beats[0].slots[0].strings[1] = "1"; m3.beats[0].slots[0].strings[2] = "1"; m3.beats[0].slots[0].strings[3] = "2"; m3.beats[0].slots[0].lyric = "F";
      m3.beats[1].slots[0].strings[3] = "2"; m3.beats[1].slots[0].lyric = "솔-";
      m3.beats[2].slots[0].strings[2] = "1"; m3.beats[2].slots[0].lyric = "C";
      m3.beats[2].slots[1].strings[3] = "0";
      m3.beats[3].slots[0].strings[4] = "2"; m3.beats[3].slots[0].lyric = "로";
      m3.beats[3].slots[1].strings[5] = "3";

      // 마디 4: E7 코드, 전음표(2분+2분)
      const m4 = {
        id: 4,
        chord1: "E7",
        chord2: "",
        beats: [
          createBeat("2"),
          createBeat("4"),
          createBeat("2"),
          createBeat("4")
        ]
      };
      m4.beats[0].slots[0].strings[1] = "0"; m4.beats[0].slots[0].strings[2] = "0"; m4.beats[0].slots[0].strings[3] = "1"; m4.beats[0].slots[0].strings[4] = "0"; m4.beats[0].slots[0].strings[5] = "2"; m4.beats[0].slots[0].strings[6] = "0"; m4.beats[0].slots[0].lyric = "끝";
      m4.beats[2].slots[0].strings[1] = "0"; m4.beats[2].slots[0].strings[6] = "0";

      return [m1, m2, m3, m4];
    };

    const INITIAL_SONG = {
      title: "일렉기타 타브 & 가사 & 코드 악보",
      artist: "연주자",
      tuning: "Standard (E A D G B E)",
      tempo: "120",
      measures: createInitialMeasures()
    };

    function App() {
      const [song, setSong] = useState(INITIAL_SONG);
      const [selectedFret, setSelectedFret] = useState("0");
      const [customFret, setCustomFret] = useState("");
      const scoreRef = useRef(null);

      // 마디 추가
      const addMeasure = () => {
        setSong(prev => ({
          ...prev,
          measures: [
            ...prev.measures,
            {
              id: Date.now(),
              chord1: "",
              chord2: "",
              beats: [createBeat("4"), createBeat("4"), createBeat("4"), createBeat("4")]
            }
          ]
        }));
      };

      // 마디 삭제
      const removeMeasure = () => {
        if (song.measures.length <= 1) return;
        setSong(prev => ({ ...prev, measures: prev.measures.slice(0, -1) }));
      };

      // 코드 변경
      const handleChordChange = (mIdx, chordKey, val) => {
        setSong(prev => {
          const nextMeasures = [...prev.measures];
          nextMeasures[mIdx][chordKey] = val;
          return { ...prev, measures: nextMeasures };
        });
      };

      // 박자 리듬(음가) 변경 (2, 4, 8, 16, 셋잇단)
      const handleRhythmChange = (mIdx, bIdx, newType) => {
        setSong(prev => {
          const nextMeasures = [...prev.measures];
          nextMeasures[mIdx].beats[bIdx] = createBeat(newType);
          return { ...prev, measures: nextMeasures };
        });
      };

      // 6선지에 프렛 직접 찍기
      const handleSlotClick = (mIdx, bIdx, slotIdx, strNum) => {
        setSong(prev => {
          const nextMeasures = [...prev.measures];
          const currentStrings = { ...nextMeasures[mIdx].beats[bIdx].slots[slotIdx].strings };

          if (selectedFret === "DEL") {
            delete currentStrings[strNum];
          } else {
            if (currentStrings[strNum] === selectedFret) {
              delete currentStrings[strNum];
            } else {
              currentStrings[strNum] = selectedFret;
            }
          }

          nextMeasures[mIdx].beats[bIdx].slots[slotIdx].strings = currentStrings;
          return { ...prev, measures: nextMeasures };
        });
      };

      // 가사 변경
      const handleLyricChange = (mIdx, bIdx, slotIdx, val) => {
        setSong(prev => {
          const nextMeasures = [...prev.measures];
          nextMeasures[mIdx].beats[bIdx].slots[slotIdx].lyric = val;
          return { ...prev, measures: nextMeasures };
        });
      };

      // VexFlow 실시간 렌더링
      useEffect(() => {
        if (!scoreRef.current) return;
        const container = scoreRef.current;
        container.innerHTML = "";

        const VF = Vex.Flow;
        const measuresPerRow = 4;
        const staveWidth = 175;
        const staveHeight = 160;
        const totalRows = Math.ceil(song.measures.length / measuresPerRow);

        const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
        renderer.resize(720, totalRows * staveHeight + 40);
        const context = renderer.getContext();

        song.measures.forEach((m, idx) => {
          const col = idx % measuresPerRow;
          const row = Math.floor(idx / measuresPerRow);
          const x = 10 + col * staveWidth;
          const y = 20 + row * staveHeight;

          const stave = new VF.TabStave(x, y, staveWidth);
          if (col === 0) {
            stave.addClef("tab");
          }
          stave.setContext(context).draw();

          const topLineY = stave.getYForLine(0);

          // [핵심 변경 1]: 마디 숫자 대신 상단에 코드(Chord) 기호 렌더링
          context.setFont("sans-serif", 13, "bold");
          context.setFillStyle("#0f172a");

          if (m.chord1 && m.chord1.trim() !== "") {
            context.fillText(m.chord1.trim(), x + (col === 0 ? 32 : 8), topLineY - 8);
          }
          if (m.chord2 && m.chord2.trim() !== "") {
            context.fillText(m.chord2.trim(), x + staveWidth / 2 + 5, topLineY - 8);
          }

          // [핵심 변경 2]: 2, 4, 8, 16, 셋잇단음표 변환 & Tuplet 적용
          const notes = [];
          const tuplets = [];
          let skipNextBeat = false;

          for (let bIdx = 0; bIdx < m.beats.length; bIdx++) {
            if (skipNextBeat) {
              skipNextBeat = false;
              continue;
            }

            const beat = m.beats[bIdx];

            // 2분음표 (2박자 병합)
            if (beat.type === "2") {
              if (bIdx === 0 || bIdx === 2) skipNextBeat = true;
              const slot = beat.slots[0];
              const positions = [];
              for (let s = 1; s <= 6; s++) {
                if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                  positions.push({ str: s, fret: slot.strings[s] });
                }
              }
              const isNote = positions.length > 0;
              const tabNote = new VF.TabNote({
                positions: isNote ? positions : [{ str: 3, fret: "" }],
                duration: isNote ? "h" : "hr"
              });
              if (slot.lyric) {
                tabNote.addModifier(new VF.Annotation(slot.lyric).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
              }
              notes.push(tabNote);
              continue;
            }

            // 4분음표
            if (beat.type === "4") {
              const slot = beat.slots[0];
              const positions = [];
              for (let s = 1; s <= 6; s++) {
                if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                  positions.push({ str: s, fret: slot.strings[s] });
                }
              }
              const isNote = positions.length > 0;
              const tabNote = new VF.TabNote({
                positions: isNote ? positions : [{ str: 3, fret: "" }],
                duration: isNote ? "q" : "qr"
              });
              if (slot.lyric) {
                tabNote.addModifier(new VF.Annotation(slot.lyric).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
              }
              notes.push(tabNote);
            }
            // 8분음표 (2분할)
            else if (beat.type === "8") {
              beat.slots.forEach(slot => {
                const positions = [];
                for (let s = 1; s <= 6; s++) {
                  if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                    positions.push({ str: s, fret: slot.strings[s] });
                  }
                }
                const isNote = positions.length > 0;
                const tabNote = new VF.TabNote({
                  positions: isNote ? positions : [{ str: 3, fret: "" }],
                  duration: isNote ? "8" : "8r"
                });
                if (slot.lyric) {
                  tabNote.addModifier(new VF.Annotation(slot.lyric).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                }
                notes.push(tabNote);
              });
            }
            // 16분음표 (4분할)
            else if (beat.type === "16") {
              beat.slots.forEach(slot => {
                const positions = [];
                for (let s = 1; s <= 6; s++) {
                  if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                    positions.push({ str: s, fret: slot.strings[s] });
                  }
                }
                const isNote = positions.length > 0;
                const tabNote = new VF.TabNote({
                  positions: isNote ? positions : [{ str: 3, fret: "" }],
                  duration: isNote ? "16" : "16r"
                });
                if (slot.lyric) {
                  tabNote.addModifier(new VF.Annotation(slot.lyric).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                }
                notes.push(tabNote);
              });
            }
            // 셋잇단음표 (8분 셋잇단 3연음)
            else if (beat.type === "triplet") {
              const tripletNotes = [];
              beat.slots.forEach(slot => {
                const positions = [];
                for (let s = 1; s <= 6; s++) {
                  if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                    positions.push({ str: s, fret: slot.strings[s] });
                  }
                }
                const isNote = positions.length > 0;
                const tabNote = new VF.TabNote({
                  positions: isNote ? positions : [{ str: 3, fret: "" }],
                  duration: isNote ? "8" : "8r"
                });
                if (slot.lyric) {
                  tabNote.addModifier(new VF.Annotation(slot.lyric).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                }
                tripletNotes.push(tabNote);
                notes.push(tabNote);
              });

              // VexFlow Tuplet 생성 (3연음 표시)
              try {
                const tuplet = new VF.Tuplet(tripletNotes, { num_notes: 3, notes_occupied: 2 });
                tuplet.setBracketed(true);
                tuplets.push(tuplet);
              } catch (e) {
                console.error(e);
              }
            }
          }

          // 음표 배치 및 렌더링
          VF.Formatter.FormatAndDraw(context, stave, notes);

          // 셋잇단음표 괄호 렌더링
          tuplets.forEach(t => {
            try {
              t.setContext(context).draw();
            } catch (e) {
              console.error(e);
            }
          });
        });
      }, [song]);

      return (
        <div className="app-container">
          <div className="editor-card no-print">
            <div className="card-top">
              <h2>🎸 일렉기타 타브 & 가사 & 코드 에디터</h2>
              <button className="btn-print" onClick={() => window.print()}>
                🖨️ A4 악보 출력하기 (4마디/줄)
              </button>
            </div>

            <div className="meta-grid">
              <div>
                <label>곡 제목</label>
                <input value={song.title} onChange={e => setSong({...song, title: e.target.value})} />
              </div>
              <div>
                <label>아티스트</label>
                <input value={song.artist} onChange={e => setSong({...song, artist: e.target.value})} />
              </div>
              <div>
                <label>튜닝</label>
                <input value={song.tuning} onChange={e => setSong({...song, tuning: e.target.value})} />
              </div>
              <div>
                <label>템포 (BPM)</label>
                <input value={song.tempo} onChange={e => setSong({...song, tempo: e.target.value})} />
              </div>
            </div>

            <div className="palette-box">
              <span className="palette-title">📌 찍을 프렛 번호 선택:</span>
              {PALETTE_FRETS.map(fret => (
                <button
                  key={fret}
                  className={`fret-btn ${fret === "DEL" ? "eraser" : ""} ${selectedFret === fret ? "active" : ""}`}
                  onClick={() => setSelectedFret(fret)}
                >
                  {fret === "DEL" ? "지우개" : fret}
                </button>
              ))}
              <input
                className="custom-fret-input"
                placeholder="직접"
                value={customFret}
                onChange={e => {
                  setCustomFret(e.target.value);
                  if (e.target.value.trim() !== "") setSelectedFret(e.target.value.trim());
                }}
              />
            </div>

            <div className="toolbar">
              <button className="btn-add" onClick={addMeasure}>➕ 마디 추가</button>
              <button className="btn-del" onClick={removeMeasure}>➖ 마지막 마디 삭제</button>
            </div>

            {/* 마디 목록 */}
            {song.measures.map((m, mIdx) => (
              <div key={m.id} className="measure-box">
                <div className="measure-header">
                  <span className="measure-title">마디 #{mIdx + 1}</span>
                  
                  {/* 상단 코드 입력란 */}
                  <div className="chord-input-area">
                    <div className="chord-group">
                      <label>코드 1 (전반부):</label>
                      <input
                        className="chord-input"
                        placeholder="예: Am"
                        value={m.chord1 || ""}
                        onChange={e => handleChordChange(mIdx, "chord1", e.target.value)}
                      />
                    </div>
                    <div className="chord-group">
                      <label>코드 2 (후반부):</label>
                      <input
                        className="chord-input"
                        placeholder="예: G"
                        value={m.chord2 || ""}
                        onChange={e => handleChordChange(mIdx, "chord2", e.target.value)}
                      />
                    </div>
                  </div>
                </div>

                {/* 박자별 리듬(음가) 선택 컨트롤 바 */}
                <div className="rhythm-control-bar">
                  {m.beats.map((beat, bIdx) => (
                    <div key={bIdx} className="beat-control">
                      <div className="beat-control-title">{bIdx + 1}박자 음가</div>
                      <select
                        className="rhythm-select"
                        value={beat.type}
                        onChange={e => handleRhythmChange(mIdx, bIdx, e.target.value)}
                      >
                        <option value="4">🅠 4분음표 (1칸)</option>
                        <option value="8">🅠 8분음표 (2칸)</option>
                        <option value="16">🅠 16분음표 (4칸)</option>
                        <option value="triplet">🅠³ 셋잇단음표 (3칸)</option>
                        {(bIdx === 0 || bIdx === 2) && (
                          <option value="2">🅗 2분음표 (2박자 병합)</option>
                        )}
                      </select>
                    </div>
                  ))}
                </div>

                {/* 6선지 직접 찍기 인터랙티브 스태프 */}
                <div className="staff-container">
                  <table className="staff-table">
                    <thead>
                      <tr>
                        <th className="staff-header-th staff-header-corner">줄 \ 리듬</th>
                        {m.beats.map((beat, bIdx) =>
                          beat.slots.map((_, sIdx) => (
                            <th
                              key={`${bIdx}-${sIdx}`}
                              className={`staff-header-th ${sIdx === 0 ? "beat-start-th" : ""}`}
                            >
                              {sIdx === 0 ? `${bIdx + 1}박` : `+${sIdx}`}
                              <div style={{ fontSize: "10px", fontWeight: "normal", color: "#64748b" }}>
                                {beat.type === "4" ? "4분" : beat.type === "8" ? "8분" : beat.type === "16" ? "16분" : beat.type === "triplet" ? "3연" : "2분"}
                              </div>
                            </th>
                          ))
                        )}
                      </tr>
                    </thead>
                    <tbody>
                      {STRINGS.map(str => (
                        <tr key={str.num} className={`string-row string-row-${str.num}`}>
                          <td className="str-label-td">{str.label}</td>
                          {m.beats.map((beat, bIdx) =>
                            beat.slots.map((slot, sIdx) => {
                              const fretVal = slot.strings[str.num];
                              return (
                                <td
                                  key={`${bIdx}-${sIdx}`}
                                  className={`slot-cell ${sIdx === 0 ? "beat-start-td" : ""}`}
                                  onClick={() => handleSlotClick(mIdx, bIdx, sIdx, str.num)}
                                  title={`${bIdx + 1}박 ${sIdx + 1}번째 / ${str.label}`}
                                >
                                  <div className="string-line"></div>
                                  {fretVal !== undefined && fretVal !== "" && (
                                    <div className={`fret-badge ${fretVal === "X" ? "fret-mute" : ""}`}>
                                      {fretVal}
                                    </div>
                                  )}
                                </td>
                              );
                            })
                          )}
                        </tr>
                      ))}
                      {/* 가사 입력 행 */}
                      <tr>
                        <td className="lyric-title-td">가사</td>
                        {m.beats.map((beat, bIdx) =>
                          beat.slots.map((slot, sIdx) => (
                            <td
                              key={`${bIdx}-${sIdx}`}
                              className={`lyric-slot-td ${sIdx === 0 ? "beat-start-td" : ""}`}
                            >
                              <input
                                placeholder=""
                                value={slot.lyric || ""}
                                onChange={e => handleLyricChange(mIdx, bIdx, sIdx, e.target.value)}
                              />
                            </td>
                          ))
                        )}
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            ))}
          </div>

          {/* A4 악보 용지 영역 (인쇄 대상: 마디 숫자 제거, 상단 코드 및 셋잇단 표기) */}
          <div className="sheet-wrapper">
            <div className="a4-sheet">
              <div className="sheet-header">
                <h1 className="sheet-title">{song.title}</h1>
                <div className="sheet-meta">
                  <span><strong>Artist:</strong> {song.artist}</span>
                  <span><strong>Tuning:</strong> {song.tuning}</span>
                  <span><strong>Tempo:</strong> ♩={song.tempo}</span>
                  <span><strong>Layout:</strong> 4 Measures / Line</span>
                </div>
              </div>
              <div ref={scoreRef} className="score-view" />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
