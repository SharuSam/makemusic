<body>

  <div id="root"></div>

  

  <script type="text/babel">

    const { useState, useEffect, useRef } = React;

  

    const STRINGS = [

      { num: 1, label: "1 (High E)" },

      { num: 2, label: "2 (B)" },

      { num: 3, label: "3 (G)" },

      { num: 4, label: "4 (D)" },

      { num: 5, label: "5 (A)" },

      { num: 6, label: "6 (Low E)" }

    ];

  

    const BASE_FREQS = {

      1: 329.63, 2: 246.94, 3: 196.00,

      4: 146.83, 5: 110.00, 6: 82.41

    };

  

    const CHROMATIC_SCALE_SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    const CHROMATIC_SCALE_FLAT  = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

  

    function transposeChord(chordStr, semitones) {

      if (!chordStr || chordStr.trim() === "") return "";

      const match = chordStr.trim().match(/^([A-G][#b]?)(.*)$/);

      if (!match) return chordStr;

  

      const root = match[1];

      const suffix = match[2];

  

      let idx = CHROMATIC_SCALE_SHARP.indexOf(root);

      if (idx === -1) idx = CHROMATIC_SCALE_FLAT.indexOf(root);

      if (idx === -1) return chordStr;

  

      let newIdx = (idx + semitones) % 12;

      if (newIdx < 0) newIdx += 12;

  

      const useFlat = root.includes("b") || (semitones < 0 && !root.includes("#"));

      const newRoot = useFlat ? CHROMATIC_SCALE_FLAT[newIdx] : CHROMATIC_SCALE_SHARP[newIdx];

  

      if (suffix.includes("/")) {

        const parts = suffix.split("/");

        const bass = parts[1];

        let bIdx = CHROMATIC_SCALE_SHARP.indexOf(bass);

        if (bIdx === -1) bIdx = CHROMATIC_SCALE_FLAT.indexOf(bass);

        if (bIdx !== -1) {

          let nbIdx = (bIdx + semitones) % 12;

          if (nbIdx < 0) nbIdx += 12;

          const nbRoot = useFlat ? CHROMATIC_SCALE_FLAT[nbIdx] : CHROMATIC_SCALE_SHARP[nbIdx];

          return newRoot + parts[0] + "/" + nbRoot;

        }

      }

  

      return newRoot + suffix;

    }

  

    const PALETTE_FRETS = ["0", "1", "2", "3", "4", "5", "7", "8", "9", "10", "12", "15", "X", "DEL"];

  

    const createSlot = () => ({ chord: "", strings: {}, lyric: "" });

  

    function createBeat(type = "4") {

      let count = 1;

      if (type === "8") count = 2;

      else if (type === "16") count = 4;

      else if (type === "triplet") count = 3;

      else if (type === "2") count = 1;

  

      return {

        type,

        slots: Array.from({ length: count }, createSlot)

      };

    }

    // React Error Boundary: 렌더링 중 오류 발생 시 흰 화면(블랭크)을 방지하고 안내 화면 표시
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: "40px 20px", textAlign: "center", background: "#ffffff", maxWidth: "600px", margin: "40px auto", borderRadius: "14px", boxShadow: "0 4px 20px rgba(0,0,0,0.1)" }}>
              <div style={{ fontSize: "40px", marginBottom: "12px" }}>⚠️</div>
              <h2 style={{ color: "#ef4444", marginBottom: "10px", fontSize: "20px" }}>악보를 표시하는 중 문제가 발생했습니다</h2>
              <p style={{ color: "#64748b", fontSize: "14px", marginBottom: "20px" }}>{this.state.error?.message || "알 수 없는 오류"}</p>
              <button style={{ background: "#2563eb", color: "white", padding: "10px 20px", borderRadius: "8px", border: "none", cursor: "pointer", fontWeight: "700" }} onClick={() => window.location.reload()}>
                🔄 페이지 새로고침
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

      const handleTranspose = (semitones) => {

        let clampedCount = 0;

        setSong(prev => {

          const nextMeasures = prev.measures.map(m => ({

            ...m,

            beats: m.beats.map(b => ({

              ...b,

              slots: b.slots.map(s => {

                  const val = s.strings[k];

                  if (val === "X") {

                    nextStrings[k] = "X";

                  } else if (val !== undefined && val !== "") {

                    const fNum = parseInt(val, 10);

                    if (!isNaN(fNum)) {

                      let target = fNum + semitones;

                      if (target < 0) {

                        target = 0;

                        clampedCount++;

                      }

                      if (target > 24) target = 24;

                      nextStrings[k] = target.toString();

                    }

                  }

                });

  

                const nextChord = s.chord ? transposeChord(s.chord, semitones) : "";

  

                return {

                  ...s,

                  strings: nextStrings,

                  chord: nextChord

                };

              })

            }))

          }));

  

          return { ...prev, measures: nextMeasures };

        });

  

        setTransposeOffset(prev => prev + semitones);

        const direction = semitones > 0 ? \`+${semitones} (반음 올림)\` : \`${semitones} (반음 내림)\`;

        if (clampedCount > 0) {

          showToast(\`ð¼ 악보가 ${direction} 이조되었습니다. (0번 개방현 이하의 음은 0프렛 유지)\`);

      const playGuitarNote = (audioCtx, freq, durationSec) => {

        if (!freq || isNaN(freq)) return;

        const now = audioCtx.currentTime;

  

        const osc = audioCtx.createOscillator();

        osc.type = "sawtooth";

        osc.frequency.setValueAtTime(freq, now);

  

        const oscSub = audioCtx.createOscillator();

        oscSub.type = "triangle";

        oscSub.frequency.setValueAtTime(freq, now);

  

        const filter = audioCtx.createBiquadFilter();

        filter.type = "lowpass";

        filter.frequency.setValueAtTime(Math.min(freq * 8, 7500), now);

        filter.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.8, 350), now + 0.12);

  

        const gainNode = audioCtx.createGain();

        gainNode.gain.setValueAtTime(0.0001, now);

        gainNode.gain.linearRampToValueAtTime(0.25, now + 0.006);

        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(durationSec * 1.3, 0.45));

  

        osc.connect(filter);

        oscSub.connect(filter);

        filter.connect(gainNode);

        gainNode.connect(audioCtx.destination);

  

        osc.start(now);

        oscSub.start(now);

        osc.stop(now + durationSec * 1.5);

        oscSub.stop(now + durationSec * 1.5);

      };

  

      const handlePlay = () => {

        if (isPlaying) {

          handleStop();

          return;

        }

  

        if (!audioCtxRef.current) {

          const AudioContextClass = window.AudioContext || window.webkitAudioContext;

          audioCtxRef.current = new AudioContextClass();

        }

        if (audioCtxRef.current.state === "suspended") {

          audioCtxRef.current.resume();

        }

  

        setIsPlaying(true);

        playTimersRef.current = [];

  

        const bpm = parseInt(song.tempo, 10) || 120;

        const quarterSec = 60 / bpm;

  

        let currentOffset = 0;

  

        song.measures.forEach((m, mIdx) => {

          let skipNextBeat = false;

          for (let bIdx = 0; bIdx < m.beats.length; bIdx++) {

            if (skipNextBeat) {

              skipNextBeat = false;

              continue;

            }

  

            const beat = m.beats[bIdx];

            if (beat.type === "2") {

              if (bIdx === 0 || bIdx === 2) skipNextBeat = true;

            }

  

            let slotDurationSec = quarterSec;

            if (beat.type === "2") slotDurationSec = quarterSec * 2;

            else if (beat.type === "4") slotDurationSec = quarterSec;

            else if (beat.type === "8") slotDurationSec = quarterSec / 2;

            else if (beat.type === "16") slotDurationSec = quarterSec / 4;

            else if (beat.type === "triplet") slotDurationSec = quarterSec / 3;

  

            beat.slots.forEach((slot, sIdx) => {

              const scheduledTime = currentOffset;

              const slotKey = \`${mIdx}-${bIdx}-${sIdx}\`;

  

              const timer = setTimeout(() => {

                setPlayingSlotKey(slotKey);

  

                Object.keys(slot.strings).forEach((strNum, chordDelayIdx) => {

                  const fretVal = slot.strings[strNum];

                  if (fretVal !== undefined && fretVal !== "" && fretVal !== "X") {

                    const fNum = parseInt(fretVal, 10);

                    if (!isNaN(fNum)) {

                      const baseFreq = BASE_FREQS[strNum];

                      const noteFreq = baseFreq * Math.pow(2, fNum / 12);

                      setTimeout(() => {

                        playGuitarNote(audioCtxRef.current, noteFreq, slotDurationSec);

                      }, chordDelayIdx * 16);

                    }

                  }

                });

              }, scheduledTime * 1000);

  

              playTimersRef.current.push(timer);

              currentOffset += slotDurationSec;

            });

          }

        });

  

        const finishTimer = setTimeout(() => {

          setIsPlaying(false);

          setPlayingSlotKey(null);

        }, currentOffset * 1000 + 300);

        playTimersRef.current.push(finishTimer);

      };

  

      const handleStop = () => {

      const handleAnalyzeImage = async () => {

          const promptText = \`

당신은 기타 타브(TAB) 악보 전문 OMR 분석가입니다.

제공된 이미지는 정확히 4마디(4 measures)로 구성된 6줄 기타 타브 악보입니다.

위에서부터 1번줄(High E) \~ 6번줄(Low E)의 프렛 번호(숫자 0\~24 또는 뮤트 X), 박자 리듬(4분 "4", 8분 "8", 16분 "16", 셋잇단음표 "triplet", 2분음표 "2"), 코드 기호(chord), 가사를 분석하세요.

반드시 마크다운 기호 없이 오직 순수한 JSON 형식으로만 응답해야 합니다:

{

}

          const endpoint = \`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}\`;

  

          const payload = {

          const result = await response.json();

  

          if (!response.ok || result.error) {

            const errDetail = result.error ? \`${result.error.message} (코드: ${result.error.code})\` : \`HTTP ${response.status}\`;

            throw new Error(\`Google Gemini API 오류: ${errDetail}\`);

          }

  

          const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;

          if (!rawText) {

            throw new Error(finishReason ? \`AI가 응답을 생성하지 못했습니다 (이유: ${finishReason})\` : "AI 분석 응답이 비어 있습니다.");

          }

  

          let cleanJson = rawText.trim();

          if (cleanJson.startsWith("\`\`\`json")) {

            cleanJson = cleanJson.replace(/^\`\`\`json\\s*/i, "").replace(/\`\`\`\\s*$/, "");

          } else if (cleanJson.startsWith("\`\`\`")) {

          }

      const handleInlineFretChange = (mIdx, bIdx, slotIdx, strNum, val) => {

        const clean = val.trim().toUpperCase();

        setSong(prev => {

            delete currentStrings[strNum];

          } else {

            currentStrings[strNum] = clean;

            if (!audioCtxRef.current) {

              const AudioContextClass = window.AudioContext || window.webkitAudioContext;

              audioCtxRef.current = new AudioContextClass();

            }

            if (audioCtxRef.current.state === "suspended") {

              audioCtxRef.current.resume();

            }

            const fNum = parseInt(clean, 10);

            if (!isNaN(fNum)) {

              const freq = BASE_FREQS[strNum] * Math.pow(2, fNum / 12);

              playGuitarNote(audioCtxRef.current, freq, 0.45);

            }

          }

  

          nextMeasures[mIdx].beats[bIdx].slots[slotIdx].strings = currentStrings;

          return { ...prev, measures: nextMeasures };

        });

      };

  

      const handleFretKeyDown = (e, mIdx, bIdx, sIdx, strNum) => {

        if (e.key === "ArrowUp") {

          e.preventDefault();

          if (strNum > 1) {

            document.getElementById(\`fret-in-${mIdx}-${bIdx}-${sIdx}-${strNum - 1}\`)?.focus();

          }

        } else if (e.key === "ArrowDown") {

          e.preventDefault();

          if (strNum < 6) {

            document.getElementById(\`fret-in-${mIdx}-${bIdx}-${sIdx}-${strNum + 1}\`)?.focus();

          }

        }

      };

  

      const handleLyricChange = (mIdx, bIdx, slotIdx, val) => {

        setSong(prev => {

          const nextMeasures = [...prev.measures];

          nextMeasures[mIdx].beats[bIdx].slots[slotIdx].lyric = val;

          return { ...prev, measures: nextMeasures };

        });

      };

  

      // VexFlow 렌더링 (안정적인 SVG 박자 기둥·보·박자표·템포 완벽 지원)
      useEffect(() => {
        try {
          if (!scoreRef.current) return;
          const container = scoreRef.current;
          container.innerHTML = "";

          const VF = Vex.Flow;
          const measuresPerRow = 4;
          const staveWidth = 182;
          // [박자 기둥 및 보(Beam) 공간 확보를 위해 세로 높이: 175px]
          const staveHeight = 175;
          const totalRows = Math.ceil(song.measures.length / measuresPerRow);

          const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
          renderer.resize(740, totalRows * staveHeight + 50);
          const context = renderer.getContext();

          if (VF.TabNote && VF.TabNote.prototype && VF.TabNote.prototype.render_options) {
            VF.TabNote.prototype.render_options.font = "bold 8.5px sans-serif";
          }

          // 박자 기둥과 빔 정보를 저장할 배열
          const rhythmItems = [];

          song.measures.forEach((m, idx) => {
            const col = idx % measuresPerRow;
            const row = Math.floor(idx / measuresPerRow);
            const x = 6 + col * staveWidth;
            const y = 20 + row * staveHeight;

            const stave = new VF.TabStave(x, y, staveWidth);

            if (col === 0) {
              stave.addClef("tab");
            }

            stave.setContext(context).draw();

            const notes = [];
            const tuplets = [];
            const measureBeatGroups = [];
            let skipNextBeat = false;

            for (let bIdx = 0; bIdx < m.beats.length; bIdx++) {
              if (skipNextBeat) {
                skipNextBeat = false;
                continue;
              }

              const beat = m.beats[bIdx];
              const currentBeatNotes = [];

              if (beat.type === "2") {
                if (bIdx === 0 || bIdx === 2) skipNextBeat = true;
                const slot = beat.slots[0];
                const positions = [];
                for (let s = 1; s <= 6; s++) {
                  if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                    positions.push({ str: s, fret: slot.strings[s] });
                  }
                }
                const isNote = positions.length > 0;
                const tabNote = new VF.TabNote({
                  positions: isNote ? positions : [{ str: 3, fret: "" }],
                  duration: isNote ? "h" : "hr"
                });
                if (tabNote.render_options) {
                  tabNote.render_options.font = "bold 8.5px sans-serif";
                }

                if (slot.chord && slot.chord.trim() !== "") {
                  tabNote.addModifier(new VF.Annotation(slot.chord.trim()).setFont("sans-serif", 12, "bold").setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
                }
                if (slot.lyric && slot.lyric.trim() !== "") {
                  tabNote.addModifier(new VF.Annotation(slot.lyric.trim()).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                }
                notes.push(tabNote);
                currentBeatNotes.push({ note: tabNote, isNote });
                measureBeatGroups.push({ type: "2", items: currentBeatNotes, stave });
                continue;
              }

              if (beat.type === "4") {
                const slot = beat.slots[0];
                const positions = [];
                for (let s = 1; s <= 6; s++) {
                  if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                    positions.push({ str: s, fret: slot.strings[s] });
                  }
                }
                const isNote = positions.length > 0;
                const tabNote = new VF.TabNote({
                  positions: isNote ? positions : [{ str: 3, fret: "" }],
                  duration: isNote ? "q" : "qr"
                });
                if (tabNote.render_options) {
                  tabNote.render_options.font = "bold 8.5px sans-serif";
                }

                if (slot.chord && slot.chord.trim() !== "") {
                  tabNote.addModifier(new VF.Annotation(slot.chord.trim()).setFont("sans-serif", 12, "bold").setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
                }
                if (slot.lyric && slot.lyric.trim() !== "") {
                  tabNote.addModifier(new VF.Annotation(slot.lyric.trim()).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                }
                notes.push(tabNote);
                currentBeatNotes.push({ note: tabNote, isNote });
                measureBeatGroups.push({ type: "4", items: currentBeatNotes, stave });
              } else if (beat.type === "8") {
                beat.slots.forEach(slot => {
                  const positions = [];
                  for (let s = 1; s <= 6; s++) {
                    if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                      positions.push({ str: s, fret: slot.strings[s] });
                    }
                  }
                  const isNote = positions.length > 0;
                  const tabNote = new VF.TabNote({
                    positions: isNote ? positions : [{ str: 3, fret: "" }],
                    duration: isNote ? "8" : "8r"
                  });
                  if (tabNote.render_options) {
                    tabNote.render_options.font = "bold 8.5px sans-serif";
                  }

                  if (slot.chord && slot.chord.trim() !== "") {
                    tabNote.addModifier(new VF.Annotation(slot.chord.trim()).setFont("sans-serif", 12, "bold").setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
                  }
                  if (slot.lyric && slot.lyric.trim() !== "") {
                    tabNote.addModifier(new VF.Annotation(slot.lyric.trim()).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                  }
                  notes.push(tabNote);
                  currentBeatNotes.push({ note: tabNote, isNote });
                });
                measureBeatGroups.push({ type: "8", items: currentBeatNotes, stave });
              } else if (beat.type === "16") {
                beat.slots.forEach(slot => {
                  const positions = [];
                  for (let s = 1; s <= 6; s++) {
                    if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                      positions.push({ str: s, fret: slot.strings[s] });
                    }
                  }
                  const isNote = positions.length > 0;
                  const tabNote = new VF.TabNote({
                    positions: isNote ? positions : [{ str: 3, fret: "" }],
                    duration: isNote ? "16" : "16r"
                  });
                  if (tabNote.render_options) {
                    tabNote.render_options.font = "bold 8.5px sans-serif";
                  }

                  if (slot.chord && slot.chord.trim() !== "") {
                    tabNote.addModifier(new VF.Annotation(slot.chord.trim()).setFont("sans-serif", 12, "bold").setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
                  }
                  if (slot.lyric && slot.lyric.trim() !== "") {
                    tabNote.addModifier(new VF.Annotation(slot.lyric.trim()).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                  }
                  notes.push(tabNote);
                  currentBeatNotes.push({ note: tabNote, isNote });
                });
                measureBeatGroups.push({ type: "16", items: currentBeatNotes, stave });
              } else if (beat.type === "triplet") {
                const tripletNotes = [];
                beat.slots.forEach(slot => {
                  const positions = [];
                  for (let s = 1; s <= 6; s++) {
                    if (slot.strings[s] !== undefined && slot.strings[s] !== "") {
                      positions.push({ str: s, fret: slot.strings[s] });
                    }
                  }
                  const isNote = positions.length > 0;
                  const tabNote = new VF.TabNote({
                    positions: isNote ? positions : [{ str: 3, fret: "" }],
                    duration: isNote ? "8" : "8r"
                  });
                  if (tabNote.render_options) {
                    tabNote.render_options.font = "bold 8.5px sans-serif";
                  }

                  if (slot.chord && slot.chord.trim() !== "") {
                    tabNote.addModifier(new VF.Annotation(slot.chord.trim()).setFont("sans-serif", 12, "bold").setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
                  }
                  if (slot.lyric && slot.lyric.trim() !== "") {
                    tabNote.addModifier(new VF.Annotation(slot.lyric.trim()).setFont("sans-serif", 11, "normal").setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM), 0);
                  }
                  tripletNotes.push(tabNote);
                  notes.push(tabNote);
                  currentBeatNotes.push({ note: tabNote, isNote });
                });
                measureBeatGroups.push({ type: "triplet", items: currentBeatNotes, stave });

                try {
                  const tuplet = new VF.Tuplet(tripletNotes, { num_notes: 3, notes_occupied: 2 });
                  tuplet.setBracketed(true);
                  tuplets.push(tuplet);
                } catch (e) {}
              }
            }

            try {
              VF.Formatter.FormatAndDraw(context, stave, notes);
            } catch (err) {
              console.warn("FormatAndDraw fallback:", err);
            }

            tuplets.forEach(t => {
              try { t.setContext(context).draw(); } catch (e) {}
            });

            // 각 박자 그룹을 리듬 렌더링 목록에 수집
            rhythmItems.push({
              measureIdx: idx,
              col, row, x, y, stave,
              groups: measureBeatGroups
            });
          });

          // 2차 패스: SVG 내 프렛 폰트 최적화 & 완벽한 박자 기둥/보/기호 렌더링
          const svg = container.querySelector("svg");
          if (svg) {
            // 프렛 폰트 축소 (8.5px, 자간 -0.8px)
            const texts = svg.querySelectorAll("text");
            texts.forEach(t => {
              const txt = t.textContent ? t.textContent.trim() : "";
              const isTuplet = t.closest && (t.closest(".vf-tuplet") || t.closest("g.vf-tuplet"));
              const isAnnotation = t.closest && (t.closest(".vf-annotation") || t.closest("g.vf-annotation"));
              const isClef = t.closest && (t.closest(".vf-clef") || t.closest("g.vf-clef"));

              if (!isTuplet && !isAnnotation && !isClef && /^[0-9X]{1,2}$/.test(txt)) {
                t.setAttribute("font-size", "8.5px");
                t.setAttribute("font-weight", "bold");
                t.setAttribute("letter-spacing", "-0.8px");
                t.style.fontSize = "8.5px";
                t.style.fontWeight = "bold";
                t.style.letterSpacing = "-0.8px";
              }
            });

            // 박자 기둥, 빔, 박자표, 템포, 마디 번호를 SVG 요소로 100% 안정적으로 직접 렌더링
            const rhythmGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            rhythmGroup.setAttribute("class", "custom-rhythm-layer");

            rhythmItems.forEach(item => {
              const stave = item.stave;
              // 6번줄(최하단 줄) Y 좌표
              const y6 = stave.getYForLine(5);
              const yStemTop = y6 + 3;
              const yStemBot = y6 + 21;

              // 1. 첫 마디에 4/4 박자표 렌더링
              if (item.measureIdx === 0) {
                const tsText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                tsText.setAttribute("x", item.x + 36);
                tsText.setAttribute("y", stave.getYForLine(2) - 2);
                tsText.setAttribute("font-family", "serif");
                tsText.setAttribute("font-size", "14px");
                tsText.setAttribute("font-weight", "bold");
                tsText.setAttribute("fill", "#0f172a");
                tsText.textContent = "4";
                rhythmGroup.appendChild(tsText);

                const tsText2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
                tsText2.setAttribute("x", item.x + 36);
                tsText2.setAttribute("y", stave.getYForLine(4) + 6);
                tsText2.setAttribute("font-family", "serif");
                tsText2.setAttribute("font-size", "14px");
                tsText2.setAttribute("font-weight", "bold");
                tsText2.setAttribute("fill", "#0f172a");
                tsText2.textContent = "4";
                rhythmGroup.appendChild(tsText2);

                // 템포 기호 (♩ = BPM)
                const tempoText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                tempoText.setAttribute("x", item.x + 8);
                tempoText.setAttribute("y", item.y - 8);
                tempoText.setAttribute("font-family", "sans-serif");
                tempoText.setAttribute("font-size", "12px");
                tempoText.setAttribute("font-weight", "bold");
                tempoText.setAttribute("fill", "#334155");
                tempoText.textContent = `♩ = ${song.tempo}`;
                rhythmGroup.appendChild(tempoText);
              }

              // 2. 각 줄 시작 마디에 마디 번호 박스 ([1], [5], [9] ...)
              if (item.col === 0) {
                const mBox = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                mBox.setAttribute("x", item.x);
                mBox.setAttribute("y", item.y - 14);
                mBox.setAttribute("width", (item.measureIdx + 1) >= 10 ? "20" : "16");
                mBox.setAttribute("height", "14");
                mBox.setAttribute("rx", "3");
                mBox.setAttribute("fill", "#f1f5f9");
                mBox.setAttribute("stroke", "#64748b");
                mBox.setAttribute("stroke-width", "1");
                rhythmGroup.appendChild(mBox);

                const mText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                mText.setAttribute("x", item.x + ((item.measureIdx + 1) >= 10 ? 10 : 8));
                mText.setAttribute("y", item.y - 3);
                mText.setAttribute("font-family", "sans-serif");
                mText.setAttribute("font-size", "9px");
                mText.setAttribute("font-weight", "800");
                mText.setAttribute("text-anchor", "middle");
                mText.setAttribute("fill", "#1e293b");
                mText.textContent = (item.measureIdx + 1).toString();
                rhythmGroup.appendChild(mText);
              }

              // 3. 각 박자별 음가 기둥(Stem) 및 보(Beam) 연결
              item.groups.forEach(bg => {
                const btype = bg.type;
                const noteItems = bg.items;
                const xs = [];

                noteItems.forEach(ni => {
                  try {
                    const nx = ni.note.getAbsoluteX();
                    if (nx && !isNaN(nx)) {
                      xs.push({ x: nx, isNote: ni.isNote });
                    }
                  } catch (e) {}
                });

                if (xs.length === 0) return;

                if (btype === "4") {
                  const target = xs[0];
                  if (target.isNote) {
                    // 4분음표 기둥
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", target.x);
                    line.setAttribute("y1", yStemTop);
                    line.setAttribute("x2", target.x);
                    line.setAttribute("y2", yStemBot);
                    line.setAttribute("stroke", "#1e293b");
                    line.setAttribute("stroke-width", "1.6");
                    rhythmGroup.appendChild(line);
                  } else {
                    // 4분쉼표 (𝄽 기호 또는 쉼표 뱃지)
                    const rText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    rText.setAttribute("x", target.x);
                    rText.setAttribute("y", y6 + 13);
                    rText.setAttribute("font-family", "sans-serif");
                    rText.setAttribute("font-size", "11px");
                    rText.setAttribute("font-weight", "bold");
                    rText.setAttribute("fill", "#64748b");
                    rText.setAttribute("text-anchor", "middle");
                    rText.textContent = "𝄽";
                    rhythmGroup.appendChild(rText);
                  }
                } else if (btype === "2") {
                  const target = xs[0];
                  if (target.isNote) {
                    // 2분음표 기둥 + 2박 원형 기호
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", target.x);
                    line.setAttribute("y1", yStemTop);
                    line.setAttribute("x2", target.x);
                    line.setAttribute("y2", yStemBot);
                    line.setAttribute("stroke", "#1e293b");
                    line.setAttribute("stroke-width", "1.6");
                    rhythmGroup.appendChild(line);

                    const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    ring.setAttribute("cx", target.x);
                    ring.setAttribute("cy", yStemBot + 2);
                    ring.setAttribute("r", "2.5");
                    ring.setAttribute("fill", "white");
                    ring.setAttribute("stroke", "#1e293b");
                    ring.setAttribute("stroke-width", "1.5");
                    rhythmGroup.appendChild(ring);
                  }
                } else if (btype === "8") {
                  // 8분음표: 기둥 2개 + 가로 보(Beam) 연결
                  const noteXs = xs.filter(item => item.isNote);
                  xs.forEach(target => {
                    if (target.isNote) {
                      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                      line.setAttribute("x1", target.x);
                      line.setAttribute("y1", yStemTop);
                      line.setAttribute("x2", target.x);
                      line.setAttribute("y2", yStemBot);
                      line.setAttribute("stroke", "#1e293b");
                      line.setAttribute("stroke-width", "1.6");
                      rhythmGroup.appendChild(line);
                    } else {
                      const rText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                      rText.setAttribute("x", target.x);
                      rText.setAttribute("y", y6 + 13);
                      rText.setAttribute("font-family", "sans-serif");
                      rText.setAttribute("font-size", "10px");
                      rText.setAttribute("font-weight", "bold");
                      rText.setAttribute("fill", "#64748b");
                      rText.setAttribute("text-anchor", "middle");
                      rText.textContent = "𝄾";
                      rhythmGroup.appendChild(rText);
                    }
                  });

                  if (noteXs.length >= 2) {
                    const beam = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    beam.setAttribute("x1", noteXs[0].x);
                    beam.setAttribute("y1", yStemBot);
                    beam.setAttribute("x2", noteXs[noteXs.length - 1].x);
                    beam.setAttribute("y2", yStemBot);
                    beam.setAttribute("stroke", "#1e293b");
                    beam.setAttribute("stroke-width", "3.2");
                    beam.setAttribute("stroke-linecap", "square");
                    rhythmGroup.appendChild(beam);
                  }
                } else if (btype === "16") {
                  // 16분음표: 기둥 4개 + 이중 가로 보(Double Beam) 연결
                  const noteXs = xs.filter(item => item.isNote);
                  xs.forEach(target => {
                    if (target.isNote) {
                      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                      line.setAttribute("x1", target.x);
                      line.setAttribute("y1", yStemTop);
                      line.setAttribute("x2", target.x);
                      line.setAttribute("y2", yStemBot);
                      line.setAttribute("stroke", "#1e293b");
                      line.setAttribute("stroke-width", "1.6");
                      rhythmGroup.appendChild(line);
                    } else {
                      const rText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                      rText.setAttribute("x", target.x);
                      rText.setAttribute("y", y6 + 13);
                      rText.setAttribute("font-family", "sans-serif");
                      rText.setAttribute("font-size", "9px");
                      rText.setAttribute("font-weight", "bold");
                      rText.setAttribute("fill", "#64748b");
                      rText.setAttribute("text-anchor", "middle");
                      rText.textContent = "𝄿";
                      rhythmGroup.appendChild(rText);
                    }
                  });

                  if (noteXs.length >= 2) {
                    const xStart = noteXs[0].x;
                    const xEnd = noteXs[noteXs.length - 1].x;

                    // 상단 빔
                    const beam1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    beam1.setAttribute("x1", xStart);
                    beam1.setAttribute("y1", yStemBot - 4.5);
                    beam1.setAttribute("x2", xEnd);
                    beam1.setAttribute("y2", yStemBot - 4.5);
                    beam1.setAttribute("stroke", "#1e293b");
                    beam1.setAttribute("stroke-width", "2.2");
                    beam1.setAttribute("stroke-linecap", "square");
                    rhythmGroup.appendChild(beam1);

                    // 하단 빔
                    const beam2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    beam2.setAttribute("x1", xStart);
                    beam2.setAttribute("y1", yStemBot);
                    beam2.setAttribute("x2", xEnd);
                    beam2.setAttribute("y2", yStemBot);
                    beam2.setAttribute("stroke", "#1e293b");
                    beam2.setAttribute("stroke-width", "2.2");
                    beam2.setAttribute("stroke-linecap", "square");
                    rhythmGroup.appendChild(beam2);
                  }
                } else if (btype === "triplet") {
                  // 셋잇단음표: 기둥 3개 + 가로 보 + 숫자 3 표기
                  const noteXs = xs.filter(item => item.isNote);
                  xs.forEach(target => {
                    if (target.isNote) {
                      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                      line.setAttribute("x1", target.x);
                      line.setAttribute("y1", yStemTop);
                      line.setAttribute("x2", target.x);
                      line.setAttribute("y2", yStemBot);
                      line.setAttribute("stroke", "#1e293b");
                      line.setAttribute("stroke-width", "1.6");
                      rhythmGroup.appendChild(line);
                    }
                  });

                  if (noteXs.length >= 2) {
                    const xStart = noteXs[0].x;
                    const xEnd = noteXs[noteXs.length - 1].x;

                    const beam = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    beam.setAttribute("x1", xStart);
                    beam.setAttribute("y1", yStemBot);
                    beam.setAttribute("x2", xEnd);
                    beam.setAttribute("y2", yStemBot);
                    beam.setAttribute("stroke", "#1e293b");
                    beam.setAttribute("stroke-width", "3");
                    beam.setAttribute("stroke-linecap", "square");
                    rhythmGroup.appendChild(beam);

                    const t3 = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    t3.setAttribute("x", (xStart + xEnd) / 2);
                    t3.setAttribute("y", yStemBot + 10);
                    t3.setAttribute("font-family", "sans-serif");
                    t3.setAttribute("font-size", "9px");
                    t3.setAttribute("font-weight", "800");
                    t3.setAttribute("text-anchor", "middle");
                    t3.setAttribute("fill", "#2563eb");
                    t3.textContent = "3";
                    rhythmGroup.appendChild(t3);
                  }
                }
              });
            });

            svg.appendChild(rhythmGroup);
          }
        } catch (err) {
          console.error("Critical rendering error in useEffect:", err);
        }
      }, [song, transposeOffset]);

  

      return (

        <div className="app-container" onPaste={handlePaste}>

          {toast && (

            <div className="toast-msg no-print">

              <span>{toast}</span>

              <button style={{ background: "transparent", color: "white", padding: 0 }} onClick={() => setToast(null)}>✕</button>

            </div>

          )}

  

          <div className="editor-card no-print">

            <div className="card-top">

              <h2>ð¸ 일렉기타 타브 & 가사 & 코드 & 오디오 & 이조 에디터</h2>

              <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>

                <button

                  className={isPlaying ? "btn-stop" : "btn-play"}

                  onClick={handlePlay}

                >

                  {isPlaying ? "⏹️ 연주 중지" : "▶️ 연주 듣기"}

                </button>

                <button className="btn-ocr" onClick={() => setShowOcrModal(true)} title="타브 악보 이미지(4마디)를 읽어 자동으로 악보 생성">

                  ð· 이미지로 4마디 생성

                </button>

                <button className="btn-save" onClick={handleSave} title="브라우저에 현재 악보 저장">

                  ð¾ 악보 저장

                </button>

                <button className="btn-load" onClick={handleOpenLoadModal} title="저장된 악보 불러오기">

                  ð 불러오기

                </button>

                <button className="btn-reset" onClick={handleReset} title="처음부터 다시 작성">

                  ð 전체 초기화

                </button>

                <button className="btn-print" onClick={() => window.print()}>

                  ð¨️ A4 악보 출력

                </button>

              </div>

            </div>

  

            <div className="meta-grid">

              <div>

                <label>곡 제목</label>

                <input value={song.title} onChange={e => setSong({...song, title: e.target.value})} />

              </div>

              <div>

                <label>아티스트</label>

                <input value={song.artist} onChange={e => setSong({...song, artist: e.target.value})} />

              </div>

              <div>

                <label>튜닝</label>

                <input value={song.tuning} onChange={e => setSong({...song, tuning: e.target.value})} />

              </div>

              <div>

                <label>템포 (BPM)</label>

                <input value={song.tempo} onChange={e => setSong({...song, tempo: e.target.value})} />

              </div>

            </div>

  

            {/* 악보 일괄 이조 컨트롤 바 */}

            <div className="transpose-bar">

              <div className="transpose-title">

                <span>ð¼ 악보 일괄 이조 (키 조절 / Transpose):</span>

                <span className="trans-status">

                  {transposeOffset === 0 ? "원키 (Original)" : transposeOffset > 0 ? \`+${transposeOffset} 반음 ↑\` : \`${transposeOffset} 반음 ↓\`}

                </span>

              </div>

              <div className="transpose-btns">

                <button className="btn-trans" onClick={() => handleTranspose(-2)} title="온음(2프렛) 낮추기">

                  ⏬ -2 (온음↓)

                </button>

                <button className="btn-trans" onClick={() => handleTranspose(-1)} title="반음(1프렛) 낮추기">

                  ð½ -1 (반음↓)

                </button>

                <button className="btn-trans" onClick={() => handleTranspose(1)} title="반음(1프렛) 올리기">

                  ð¼ +1 (반음↑)

                </button>

                <button className="btn-trans" onClick={() => handleTranspose(2)} title="온음(2프렛) 올리기">

                  ⏫ +2 (온음↑)

                </button>

                {transposeOffset !== 0 && (

                  <button

                    className="btn-trans"

                    style={{ background: "#fdf2f8", borderColor: "#f43f5e", color: "#e11d48" }}

                    onClick={() => handleTranspose(-transposeOffset)}

                    title="원래 키로 되돌리기"

                  >

                    ↺ 원키 복원

                  </button>

                )}

              </div>

            </div>

  

            {/* 빠른 프렛 팔레트 */}

            <div className="palette-box">

              <span className="palette-title">ð 빠른 프렛 버튼:</span>

              {PALETTE_FRETS.map(fret => (

                <button

                  key={fret}

                  className={\`fret-btn ${fret === "DEL" ? "eraser" : ""} ${selectedFret === fret ? "active" : ""}\`}

                  onClick={() => setSelectedFret(fret)}

                >

                  {fret === "DEL" ? "지우개" : fret}

                </button>

              ))}

              <input

                className="custom-fret-input"

                placeholder="직접"

                value={customFret}

                onChange={e => {

                  setCustomFret(e.target.value);

                  if (e.target.value.trim() !== "") setSelectedFret(e.target.value.trim());

                }}

              />

            </div>

  

            <div className="toolbar">

              <div className="btn-group">

                <button className="btn-add" onClick={addMeasure}>➕ 마디 추가</button>

                <button className="btn-del" onClick={removeMeasure}>➖ 마지막 마디 삭제</button>

              </div>

              <div className="btn-group">

                <span style={{ fontSize: "13px", color: "#64748b" }}>

                  ð¡ 두 자리 프렛 번호(10, 12, 15, 18 등)가 겹치지 않도록 폰트 크기와 자간이 최적화되었습니다.

                </span>

              </div>

            </div>

  

            {/* 마디 목록 */}

            {song.measures.map((m, mIdx) => (

              <div key={m.id} className="measure-box">

                <div className="measure-header">

                  <span className="measure-title">마디 #{mIdx + 1}</span>

                  <span className="measure-hint">ð¡ 타브 선 위의 동그라미를 클릭하고 0\~24 숫자를 바로 입력하세요.</span>

                </div>

  

                <div className="rhythm-control-bar">

                  {m.beats.map((beat, bIdx) => (

                    <div key={bIdx} className="beat-control">

                      <div className="beat-control-title">{bIdx + 1}박자 음가</div>

                      <select

                        className="rhythm-select"

                        value={beat.type}

                        onChange={e => handleRhythmChange(mIdx, bIdx, e.target.value)}

                      >

                        <option value="4">ð  4분음표 (1칸)</option>

                        <option value="8">ð  8분음표 (2칸)</option>

                        <option value="16">ð  16분음표 (4칸)</option>

                        <option value="triplet">ð ³ 셋잇단음표 (3칸)</option>

                        {(bIdx === 0 || bIdx === 2) && (

                          <option value="2">ð 2분음표 (2박자 병합)</option>

                        )}

                      </select>

                    </div>

                  ))}

                </div>

  

                <div className="staff-container">

                  <table className="staff-table">

                    <thead>

                      <tr>

                        <th className="staff-header-th staff-header-corner">구분 \\ 박자</th>

                        {m.beats.map((beat, bIdx) =>

                          beat.slots.map((_, sIdx) => (

                            <th

                              key={\`${bIdx}-${sIdx}\`}

                              className={\`staff-header-th ${sIdx === 0 ? "beat-start-th" : ""}\`}

                            >

                              {sIdx === 0 ? \`${bIdx + 1}박\` : \`+${sIdx}\`}

                              <div style={{ fontSize: "10px", fontWeight: "normal", color: "#64748b" }}>

                                {beat.type === "4" ? "4분" : beat.type === "8" ? "8분" : beat.type === "16" ? "16분" : beat.type === "triplet" ? "3연" : "2분"}

                              </div>

                            </th>

                          ))

                        )}

                      </tr>

                    </thead>

                    <tbody>

                      <tr>

                        <td className="chord-title-td">코드 (Chord)</td>

                        {m.beats.map((beat, bIdx) =>

                          beat.slots.map((slot, sIdx) => (

                            <td

                              key={\`${bIdx}-${sIdx}\`}

                              className={\`chord-slot-td ${sIdx === 0 ? "beat-start-td" : ""}\`}

                            >

                              <input

                                placeholder="코드"

                                value={slot.chord || ""}

                                onChange={e => handleSlotChordChange(mIdx, bIdx, sIdx, e.target.value)}

                              />

                            </td>

                          ))

                        )}

                      </tr>

  

                      {STRINGS.map(str => (

                        <tr key={str.num} className={\`string-row string-row-${str.num}\`}>

                          <td className="str-label-td">{str.label}</td>

                          {m.beats.map((beat, bIdx) =>

                            beat.slots.map((slot, sIdx) => {

                              const fretVal = slot.strings[str.num];

                              const slotKey = \`${mIdx}-${bIdx}-${sIdx}\`;

                              const isSlotPlaying = playingSlotKey === slotKey;

                              const inputId = \`fret-in-${mIdx}-${bIdx}-${sIdx}-${str.num}\`;

                              const hasFret = fretVal !== undefined && fretVal !== "";

  

                              return (

                                <td

                                  key={\`${bIdx}-${sIdx}\`}

                                  className={\`slot-cell ${sIdx === 0 ? "beat-start-td" : ""} ${isSlotPlaying ? "playing-slot" : ""}\`}

                                  onClick={() => document.getElementById(inputId)?.focus()}

                                >

                                  <div className="string-line"></div>

                                  <input

                                    id={inputId}

                                    className={\`inline-fret-input ${hasFret ? "has-fret" : ""} ${fretVal === "X" ? "has-mute" : ""}\`}

                                    value={fretVal || ""}

                                    placeholder="·"

                                    maxLength={2}

                                    onChange={e => handleInlineFretChange(mIdx, bIdx, sIdx, str.num, e.target.value)}

                                    onKeyDown={e => handleFretKeyDown(e, mIdx, bIdx, sIdx, str.num)}

                                    onFocus={e => e.target.select()}

                                    title={\`${str.label} / ${bIdx + 1}박 ${sIdx + 1}번째 프렛 번호 입력\`}

                                  />

                                </td>

                              );

                            })

                          )}

                        </tr>

                      ))}

  

                      <tr>

                        <td className="lyric-title-td">가사 (Lyrics)</td>

                        {m.beats.map((beat, bIdx) =>

                          beat.slots.map((slot, sIdx) => (

                            <td

                              key={\`${bIdx}-${sIdx}\`}

                              className={\`lyric-slot-td ${sIdx === 0 ? "beat-start-td" : ""}\`}

                            >

                              <input

                                placeholder=""

                                value={slot.lyric || ""}

                                onChange={e => handleLyricChange(mIdx, bIdx, sIdx, e.target.value)}

                              />

                            </td>

                          ))

                        )}

                      </tr>

                    </tbody>

                  </table>

                </div>

              </div>

            ))}

          </div>

  

          {/* 4마디 악보 이미지 자동 인식 모달 */}

          {showOcrModal && (

            <div className="modal-overlay no-print" onClick={() => setShowOcrModal(false)}>

              <div className="modal-card" onClick={e => e.stopPropagation()}>

                <div className="modal-header">

                  <h3>ð· 4마디 타브 악보 이미지 자동 인식</h3>

                  <button style={{ background: "transparent", color: "#64748b", fontSize: "18px" }} onClick={() => setShowOcrModal(false)}>✕</button>

                </div>

  

                <div className="guide-box">

                  <div className="guide-title">

                    <span>ð 권장 이미지 형식 (4마디 1줄 캡처)</span>

                  </div>

                  <div className="guide-desc">

                    제시해주신 형태처럼 <strong>가로 4마디(4 Measures)가 한 줄로 깨끗하게 캡처된 타브 악보 이미지</strong>를 권장합니다.<br />

                    아래 예시와 같은 비율로 캡처된 이미지를 올리시면 정확하게 프렛 번호와 박자를 읽어냅니다.

                  </div>

                  

                  <svg className="sample-preview-img" viewBox="0 0 700 70" height="70">

                    <rect width="100%" height="100%" fill="#ffffff" />

                    {[15, 23, 31, 39, 47, 55].map((y, i) => (

                      <line key={i} x1="10" y1={y} x2="690" y2={y} stroke="#94a3b8" strokeWidth="1" />

                    ))}

                    <line x1="10" y1="15" x2="10" y2="55" stroke="#000" strokeWidth="2" />

                    <line x1="180" y1="15" x2="180" y2="55" stroke="#000" strokeWidth="1" />

                    <line x1="350" y1="15" x2="350" y2="55" stroke="#000" strokeWidth="1" />

                    <line x1="520" y1="15" x2="520" y2="55" stroke="#000" strokeWidth="1" />

                    <line x1="690" y1="15" x2="690" y2="55" stroke="#000" strokeWidth="2" />

                    <text x="15" y="12" fontSize="9" fontWeight="bold" fill="#64748b">[마디 1]</text>

                    <text x="60" y="27" fontSize="10" fontWeight="bold" fill="#1e293b">15</text>

                    <text x="80" y="27" fontSize="10" fontWeight="bold" fill="#1e293b">13</text>

                    <text x="120" y="19" fontSize="10" fontWeight="bold" fill="#1e293b">15</text>

                    <text x="140" y="19" fontSize="10" fontWeight="bold" fill="#1e293b">15</text>

  

                    <text x="185" y="12" fontSize="9" fontWeight="bold" fill="#64748b">[마디 2]</text>

                    <text x="210" y="35" fontSize="10" fontWeight="bold" fill="#1e293b">12</text>

                    <text x="235" y="35" fontSize="10" fontWeight="bold" fill="#1e293b">14</text>

                    <text x="280" y="19" fontSize="10" fontWeight="bold" fill="#1e293b">10 12 13</text>

  

                    <text x="355" y="12" fontSize="9" fontWeight="bold" fill="#64748b">[마디 3]</text>

                    <text x="380" y="27" fontSize="10" fontWeight="bold" fill="#1e293b">12-13</text>

  

                    <text x="525" y="12" fontSize="9" fontWeight="bold" fill="#64748b">[마디 4]</text>

                    <text x="550" y="27" fontSize="10" fontWeight="bold" fill="#1e293b">10 12 13</text>

                    <text x="610" y="19" fontSize="10" fontWeight="bold" fill="#1e293b">15</text>

                  </svg>

                </div>

  

                <div

                  className="drop-zone"

                  onClick={() => ocrFileInputRef.current?.click()}

                  title="클릭하여 파일 선택 또는 이미지를 클립보드에서 Ctrl+V로 붙여넣으세요"

                >

                  <div className="drop-zone-icon">ð¼️</div>

                  <div style={{ fontWeight: "700", fontSize: "14px", color: "#334155", marginBottom: "4px" }}>

                    4마디 타브 악보 이미지를 클릭하여 선택하거나 <strong>Ctrl+V</strong>로 붙여넣으세요

                  </div>

                  <div style={{ fontSize: "12px", color: "#64748b" }}>

                    PNG, JPG, WebP 캡처 이미지 지원

                  </div>

                  <input

                    ref={ocrFileInputRef}

                    type="file"

                    accept="image/*"

                    style={{ display: "none" }}

                    onChange={e => handleImageSelect(e.target.files[0])}

                  />

                </div>

  

                {imagePreview && (

                  <div style={{ marginBottom: "16px", textAlign: "center" }}>

                    <div style={{ fontSize: "12px", fontWeight: "700", color: "#475569", marginBottom: "6px", textAlign: "left" }}>

                      선택된 4마디 이미지 미리보기:

                    </div>

                    <img src={imagePreview} alt="Preview" style={{ maxWidth: "100%", maxHeight: "140px", border: "1px solid #cbd5e1", borderRadius: "6px" }} />

                  </div>

                )}

  

                <div className="api-key-box">

                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "4px" }}>

                    <label style={{ margin: 0 }}>ð Gemini API Key (무료 AI 비전 판독용):</label>

                    <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" style={{ fontSize: "11px", color: "#2563eb", textDecoration: "underline" }}>

                      무료 API 키 발급받기

                    </a>

                  </div>

                  <input

                    type="password"

                    placeholder="AI Studio에서 발급받은 Gemini API 키 입력 (브라우저에 자동 보관)"

                    value={geminiApiKey}

                    onChange={e => setGeminiApiKey(e.target.value)}

                  />

                </div>

  

                <div style={{ display: "flex", gap: "16px", marginBottom: "18px", fontSize: "13px", color: "#334155" }}>

                  <label style={{ display: "flex", alignItems: "center", gap: "6px", cursor: "pointer" }}>

                    <input

                      type="radio"

                      name="ocrMode"

                      checked={!ocrModeAppend}

                      onChange={() => setOcrModeAppend(false)}

                    />

                    새 악보로 4마디 생성 (대체)

                  </label>

                  <label style={{ display: "flex", alignItems: "center", gap: "6px", cursor: "pointer" }}>

                    <input

                      type="radio"

                      name="ocrMode"

                      checked={ocrModeAppend}

                      onChange={() => setOcrModeAppend(true)}

                    />

                    기존 악보 뒤에 4마디 추가

                  </label>

                </div>

  

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid #e2e8f0", paddingTop: "14px" }}>

                  <button

                    style={{ background: "#f1f5f9", color: "#475569", border: "1px solid #cbd5e1" }}

                    onClick={loadExampleSample}

                    title="첨부해주신 솔로 4마디 악보 데이터를 즉시 로드합니다"

                  >

                    ✨ 첨부 예시 악보 즉시 생성

                  </button>

  

                  <div style={{ display: "flex", gap: "8px" }}>

                    <button style={{ background: "#e2e8f0", color: "#334155" }} onClick={() => setShowOcrModal(false)}>

                      취소

                    </button>

                    <button

                      className="btn-ocr"

                      disabled={isAnalyzing}

                      onClick={handleAnalyzeImage}

                    >

                      {isAnalyzing ? "⏳ AI 이미지 판독 중..." : "ð 4마디 자동 변환 시작"}

                    </button>

                  </div>

                </div>

              </div>

            </div>

          )}

  

          {/* 저장 목록 모달 */}

          {showLoadModal && (

            <div className="modal-overlay no-print" onClick={() => setShowLoadModal(false)}>

              <div className="modal-card" onClick={e => e.stopPropagation()}>

                <div className="modal-header">

                  <h3>ð 저장된 악보 목록</h3>

                  <button style={{ background: "transparent", color: "#64748b", fontSize: "18px" }} onClick={() => setShowLoadModal(false)}>✕</button>

                </div>

  

                {savedList.length === 0 ? (

                  <p style={{ textAlign: "center", color: "#64748b", padding: "24px 0", fontSize: "14px" }}>

                    아직 브라우저에 저장된 악보가 없습니다.<br />[ð¾ 악보 저장] 버튼을 눌러 악보를 저장해 보세요.

                  </p>

                ) : (

                  <div className="saved-list">

                    {savedList.map(item => (

                      <div key={item.id} className="saved-item">

                        <div className="saved-item-info">

                          <div className="saved-item-title">{item.title}</div>

                          <div className="saved-item-date">저장일시: {item.savedAt}</div>

                        </div>

                        <div className="saved-item-actions">

                          <button className="btn-load" style={{ padding: "6px 12px", fontSize: "12px" }} onClick={() => loadSavedScore(item)}>

                            열기

                          </button>

                          <button className="btn-del" style={{ padding: "6px 10px", fontSize: "12px" }} onClick={() => deleteSavedScore(item.id)}>

                            삭제

                          </button>

                        </div>

                      </div>

                    ))}

                  </div>

                )}

  

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid #e2e8f0", paddingTop: "14px" }}>

                  <button style={{ background: "#475569", color: "white", fontSize: "13px" }} onClick={() => fileInputRef.current?.click()}>

                    ð 컴퓨터에서 파일 열기 (.json)

                  </button>

                  <input

                    ref={fileInputRef}

                    type="file"

                    accept=".json"

                    style={{ display: "none" }}

                    onChange={e => {

                      const file = e.target.files[0];

                      if (!file) return;

                      const reader = new FileReader();

                      reader.onload = (event) => {

                        try {

                          const data = JSON.parse(event.target.result);

                          if (data.measures) {

                            setSong(data);

                            setShowLoadModal(false);

                            setTransposeOffset(0);

                            showToast(\`ð 파일에서 "${data.title}" 악보를 성공적으로 불러왔습니다.\`);

                          }

                        } catch (err) {

                          alert("파일을 읽는 중 오류가 발생했습니다.");

                        }

                      };

                      reader.readAsText(file);

                    }}

                  />

                  <button style={{ background: "#e2e8f0", color: "#334155", fontSize: "13px" }} onClick={() => setShowLoadModal(false)}>

                    닫기

                  </button>

                </div>

              </div>

            </div>

          )}

  

          {/* A4 악보 용지 영역 */}

          <div className="sheet-wrapper">

            <div className="a4-sheet">

              <div className="sheet-header">

                <h1 className="sheet-title">{song.title}</h1>

                <div className="sheet-meta">

                  <span><strong>Artist:</strong> {song.artist}</span>

                  <span><strong>Tuning:</strong> {song.tuning}</span>

                  <span><strong>Tempo:</strong> ♩={song.tempo}</span>

                  <span><strong>Layout:</strong> 4 Measures / Line</span>

                </div>

              </div>

              <div ref={scoreRef} className="score-view" />

            </div>

          </div>

        </div>

      );

    }

  

        ReactDOM.createRoot(document.getElementById("root")).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
